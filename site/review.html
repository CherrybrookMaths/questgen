// Job 3 (owner 14 Nov: "What if we dropped them and rerendered them in the new location?"): a paper in review keeps its own
// pack (page scans + crops, docs[doc].ip); once cleared, its scans are gone and the crops the page can still show are in the
// crop group data/crop/g<doc % 8>.json (tools/image_lifecycle.py). The key is the same in both: 'figures/<key>.png'.
const pack=doc=>{const f=B?.docs?.[doc]?.ip?'data/img/'+doc+'.json':packFile('crop',doc);
  return PACKS[f]||(PACKS[f]=fetch(QG.url(f,B?.built)).then(r=>r.json()).catch(()=>({})))};
// owner 15 Nov (via workflow brief): "Lets do ... 4" -> fewer published files. Redraw (svg) and overlay/first-redraw (cmp)
// packs are group files data/<kind>/g<paper id % n>.json, not one per paper; still fetched lazily, once per group.
// PACK_G must match GROUPS in tools/packs.py (batch_check checks it). Page images (data/img) stay one file per paper while in review.
const PACK_G={svg:32,cmp:1,crop:8};
const packFile=(kind,doc)=>'data/'+kind+'/g'+(parseInt(doc,10)%PACK_G[kind])+'.json';
const CMPS={}; const cmps=doc=>{const f=packFile('cmp',doc);return CMPS[f]||(CMPS[f]=fetch(QG.url(f,B?.built)).then(r=>r.json()).catch(()=>({})))};
const svgs=doc=>{const f=packFile('svg',doc);return SVGS[f]||(SVGS[f]=fetch(QG.url(f,B?.built)).then(r=>r.json()).catch(()=>({})))};
function hydrate(root,q,mode){
  root.querySelectorAll('.figslot[data-fig]').forEach(el=>{
    // owner: "I cannot see the x-axis". Solution diagrams Claude drew (<paper>_q<n>_s<k>) have no original, and their
    // 200 dpi PNG loses 1-pixel axes when the browser shrinks it, so they always show as the vector SVG.
    const k=el.dataset.fig, f=B.figs[k], useNew=f&&(figDec(q,k)==='approved'||(/_s\d+$/.test(k)&&f.status!=='table'));
    if(useNew&&f.status==='table'&&f.table){el.innerHTML=dtHTML(f.table,{blank:true});typeset(el);return}

    if(im.dataset.kind==='svg') svgs(doc).then(m=>{if(m[k]){if(m[k].startsWith('data:image/png'))im.onload=()=>{im.style.width=Math.round(im.naturalWidth*0.32)+'px'};im.src=m[k]}else im.alt='Redraw missing'});
    else pack(doc).then(m=>{const p='figures/'+k+'.png';if(m[p]){im.onload=()=>{im.style.width=Math.round(im.naturalWidth*0.48)+'px'};im.src=m[p]}else im.alt='Image missing: '+k});

/* ---------- question body (shared by both views) ---------- */
function leaf(q,p){return !q.parts.some(c=>c.parent===p.id)}
function qBody(q,mode){
  if(!QG.has(q))return QG.pending(q,mode);   // Fix 1 (owner 14 Nov: "Ok we should run Fix 1 and 2"): text not here yet: a placeholder that fills itself in
  const show=mode==='review'||revealed.has(q.id);

    const tags=lf&&mode!=='bank'?(mode==='tags'?tagsHTML(q,p):mode==='review'?`<details class="tagfold"${editing===p.id?' open':''}><summary>Syllabus tags (not part of your check)</summary>${tagEditHTML(q,p)}</details>`:tagsHTML(q,p)):'';
    const h=`<div class="part ${p.parent?'child':''} ${first&&!p.label?'first':''} ${p.label?'':'nolabel'}">${p.label?`<span class="plabel">(${esc(p.label)})</span>`:''}
      <div class="tx">${tex(p.latex)}${partFigs(p.id)}</div><span class="pmarks">${p.marks!=null&&!(q.parts.length===1&&p.marks===q.marks)?p.marks+(p.marks===1?' mark':' marks'):''}</span>

/* ---------- topic index ---------- */
let TOPICS=null;
// owner 12 Nov ("a questions parts shouldn't be split if they're related" -> "Yeah lets do that"): ONE topic home per
// question = the subheading carrying the most marks across its parts' main dot points. Other parts' topics become gates only.
const subKey=id=>id==='removed'?'special:removed':id==='no_match'?'special:no_match':DM[id]?'sub:'+DM[id].yl+'|'+DM[id].fa+'|'+(DM[id].sub||''):null;
function partPri(q,p,side){if(side==='res'){const v=reviews['q'+q.id]?.tagres?.[p.id];if(v==='A'||v==='B')side=v;else if(v?.id)return [v.id];else if(v?.cov)return [v.cov];else side='cur'}
  if(side!=='cur'&&p.tagd){const x=p.tagd[side];return x.removed?['removed']:x.dp.filter(d=>d[1]==='primary').map(d=>d[0])}
  return effTags(q,p).filter(t=>t.primary).map(t=>t.cov==='removed'||t.cov==='no_match'?t.cov:t.id)}
// tie on marks -> the topic of the LATER part wins (spec: "on a tie, the final answer decides"; owner 12 Nov on QID 1221:
// "both were wrong here, this should've been in integration")
function homeOf(q,side){const w=new Map(),last=new Map();q.parts.filter(p=>leaf(q,p)).forEach((p,pi)=>{const ids=partPri(q,p,side),m=(p.marks||1)/(ids.length||1);ids.forEach(i=>{const k=subKey(i);if(k){w.set(k,(w.get(k)||0)+m);last.set(k,pi)}})});
  // owner 12 Nov: "show the derivative, hence integrate" -> integration, whatever the marks. The test reads the part text, so it
  // runs once in tools/bank_split.py (q.hx); the index has no text (Fix 1, owner 14 Nov: "Ok we should run Fix 1 and 2")
  const lv=q.parts.filter(p=>leaf(q,p)),lp=lv[lv.length-1];
  if(q.hx){const k=subKey(partPri(q,lp,side)[0]);if(k)return k}
  if(w.size>1&&w.has('special:removed'))w.delete('special:removed');   // owner 12 Nov: a removed 3D part never decides the home when other parts are in the course
  let best=null,bv=-1,bp=-1;w.forEach((v,k)=>{const lp=last.get(k);if(v>bv+1e-9||(Math.abs(v-bv)<1e-9&&lp>bp)){bv=v;best=k;bp=lp}});return best}
function homeNeed(q){return !q.dup_of&&q.parts.some(p=>p.tagd)&&homeOf(q,'A')!==homeOf(q,'B')}
function qHome(q){const r=reviews['q'+q.id]?.home;if(r==='A'||r==='B')return homeOf(q,r);if(r?.id)return subKey(r.id);if(r?.cov)return subKey(r.cov);return partsDone(q)?homeOf(q,'res'):homeOf(q,'cur')}
// picks made per part before the switch to one home per question (5 parts, 12 Nov) still count
function partsDone(q){const t=reviews['q'+q.id]?.tagres;return !!t&&q.parts.filter(tagNeed).every(p=>t[p.id])}

function qPlaces(q){ // owner 12 Nov: one topic home per question
  const h=qHome(q); return new Set(h?[h]:[]);
}
// owner 12 Nov ("Questions aren't showing in the bank until approved right?" -> "yeah do that"): the Bank shows approved
// questions only; the owner can switch unapproved ones back on (remembered per browser)
let BANKALL=(()=>{try{return localStorage.getItem('bankall')==='1'}catch(e){return false}})();
// owner 13 Nov: "is there a point in this showing if all questions are approvied?" The chip shows only when some questions are
// unapproved AND the viewer is an editor (isEditor(), the Teach | Curate check). Non-editors never see unapproved questions, whatever BANKALL says.
const bankAll=()=>BANKALL&&isEditor();

// owner 13 Nov: "so can we sync the number on the bank and the processes pls": the Bank hero and Processes › Import history
// both count from here, so the two can never disagree. A paper filed twice is hidden whole by build_bank.py.
function bankStats(){const qs=B.questions.filter(inBank);return {questions:qs.length,papers:new Set(qs.map(q=>q.doc)).size}}
function bankSwitch(){if(!isEditor())return'';const all=B.questions.filter(q=>!q.dup_of).length,ok=B.questions.filter(q=>!q.dup_of&&qState(q)==='approved').length;
  if(ok>=all)return'';
  return `<button class="bankall" data-bankall="1" aria-pressed="${BANKALL}" title="Unapproved questions are still being checked">${BANKALL?`Showing all ${all.toLocaleString()} · <u>approved only</u>`:`Approved only (${ok.toLocaleString()} of ${all.toLocaleString()}) · <u>include unapproved</u>`}</button>`}
function buildTopics(){

  DOTS.forEach(d=>{const m=d.yl===12?T.y12:T.y11;if(!m.has(d.fa))m.set(d.fa,new Map());const s=m.get(d.fa);const sk=d.sub||'';if(!s.has(sk))s.set(sk,{dps:[],qs:[]});s.get(sk).dps.push(d);T.byKey['sub:'+d.yl+'|'+d.fa+'|'+sk]=s.get(sk)});

}
const faCount=subs=>new Set([...subs.values()].flatMap(s=>s.qs.map(q=>q.id))).size;

// Clock times in the viewer's own time zone ("2:05 pm"); the date only when it is not today ("12 Nov, 2:05 pm").
function clockT(s){const d=parseT(s);if(!d)return s?String(s):'';const t=d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',hour12:true}).replace(/[\u00a0\u202f]/g,' ').replace(/\s*([ap])\.?m\.?$/i,(m,x)=>' '+x.toLowerCase()+'m');
  return d.toDateString()===new Date().toDateString()?t:d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})+', '+t}
function durT(a,b){const x=parseT(a),y=parseT(b);if(!x||!y||y<x)return'';const m=Math.round((y-x)/60000);return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'')}
// one line of times for a job: "Started 2:05 pm · Est. finish 3:10 pm" (running/queued) or "Started … · Finished … · took 42 min" (done)
function jobTimes(j){const done=(j.status||'')==='done'||!!j.finished,out=[];
  if(j.started)out.push(`<span class="jt">Started <b>${esc(clockT(j.started))}</b></span>`);
  if(done&&j.finished){out.push(`<span class="jt">Finished <b>${esc(clockT(j.finished))}</b></span>`);const d=durT(j.started,j.finished);if(d)out.push(`<span class="jt">took ${esc(d)}</span>`)}
  else if(!done&&j.eta)out.push(`<span class="jt">Est. finish <b>${esc(clockT(j.eta))}</b></span>`);
  return out.length?`<span class="jtimes">${out.join('<span class="jsep" aria-hidden="true"> · </span>')}</span>`:''}
// "Stage 2 of 4" as a small bar, when the step says "N of M"
function stepBar(step){const m=/(\d+)\s*(?:of|\/)\s*(\d+)/i.exec(String(step||''));if(!m||!+m[2])return'';const f=Math.max(0,Math.min(1,+m[1]/+m[2]));
  return `<span class="jbar" role="progressbar" aria-valuemin="0" aria-valuemax="${+m[2]}" aria-valuenow="${+m[1]}" aria-label="${esc(step)}"><i style="width:${Math.round(f*100)}%"></i></span>`}
function queueItems(st){return ((QUEUE&&QUEUE.items)||[]).filter(x=>x&&x.title&&(!st||(x.status||'queued')===st)).sort((a,b)=>(+a.order||1e9)-(+b.order||1e9))}
function runningNow(){const jobs=JOBS.filter(j=>j&&j.name&&!(QUEUE&&/^\s*queued\b/i.test(j.name))).map(j=>({...j,src:'job'}));
  const have=new Set(jobs.map(j=>String(j.name).trim().toLowerCase()));
  return jobs.concat(queueItems('running').filter(x=>!have.has(String(x.title).trim().toLowerCase())).map(x=>({name:x.title,detail:x.detail,started:x.started,eta:x.eta,step:x.step,status:'running',asked:x.asked,src:'queue'})))}
// owner 13 Nov: "the stuff should show over the pill on hover instead. Also remove the open processes button there because
// clicking on the pill already takes you there". The popover lists the jobs (title, step, started / est. finish) and has no
// "Open Processes" link: a click on the pill goes there. Touch (no hover): the first tap shows it, a tap on it or a second tap on the pill opens Processes.
function renderJobs(){const el=$('#jobs');if(!el)return;const run=runningNow(),que=queueItems('queued');
  // owner 15 Nov: the pills lead to Processes (Curate), so only editors see them
  el.hidden=!isOwnerV()||(!run.length&&!que.length);if(el.hidden){el.innerHTML='';setHdr();return}
  const hit=run.filter(j=>j.affects&&view==='review'&&rfilter===j.affects);
  const row=(j,n)=>`<span class="job"><b>${n?`<span class="qn">${n}</span>`:''}${esc(j.name||j.title)}</b>${j.step?`<span class="jstep">${esc(j.step)}${stepBar(j.step)}</span>`:''}${j.detail?`<span class="muted">${esc(j.detail)}</span>`:''}${jobTimes(j)||(j.started?`<span class="muted when">${esc(startedAgo(j.started))}</span>`:'')}</span>`;
  const runPill=run.length?`<span class="jp run${hit.length?' hit':''}"><a class="jpill" href="#processes/work" aria-describedby="jpopR"><span class="dot" aria-hidden="true"></span>${hit.length?'Wait · ':''}${run.length} running</a>
    <span class="jpop" role="tooltip" id="jpopR">${run.map(j=>row(j)).join('')}${hit.length?`<span class="jwarn">Wait before reviewing this step: ${esc(hit.map(j=>j.name).join(', '))} will change it.</span>`:''}</span></span>`:'';
  const quePill=que.length?`<span class="jp que"><a class="jpill" href="#processes/work" aria-describedby="jpopQ">${que.length} queued</a>
    <span class="jpop" role="tooltip" id="jpopQ">${que.slice(0,6).map((x,i)=>row(x,i+1)).join('')}${que.length>6?`<span class="muted">and ${que.length-6} more</span>`:''}</span></span>`:'';
  el.innerHTML=runPill+quePill;setHdr()}
function placeJpop(jp){const pill=jp&&jp.querySelector('.jpill'),pop=jp&&jp.querySelector('.jpop');if(!pill||!pop)return;const r=pill.getBoundingClientRect(),w=Math.min(380,innerWidth-32);
  pop.style.width=w+'px';pop.style.top=(r.bottom+8)+'px';pop.style.left=Math.max(16,Math.min(r.left,innerWidth-16-w))+'px'}
document.addEventListener('mouseover',e=>{const jp=e.target.closest&&e.target.closest('.jobs .jp');if(jp&&!jp.contains(e.relatedTarget))placeJpop(jp)});
document.addEventListener('focusin',e=>{const jp=e.target.closest&&e.target.closest('.jobs .jp');if(jp)placeJpop(jp)});
// touch: no hover, so the first tap on a pill opens its list; a tap on the list or a second tap on the pill goes to Processes; a tap elsewhere closes it
document.addEventListener('click',e=>{const pill=e.target.closest('.jobs .jpill'),pop=e.target.closest('.jobs .jpop'),open=document.querySelector('.jobs .jp.open');
  if(pop){e.preventDefault();if(open)open.classList.remove('open');location.hash='#processes/work';return}   // owner 13 Nov (Work | Papers): the pills lead to Work
  if(open&&!open.contains(e.target))open.classList.remove('open');
  if(!pill)return;const jp=pill.closest('.jp');let touch=false;try{touch=matchMedia('(hover:none)').matches}catch(_){}
  if(touch&&!jp.classList.contains('open')){e.preventDefault();placeJpop(jp);jp.classList.add('open')}else jp.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.querySelector('.jobs .jp.open');if(o)o.classList.remove('open')}});

<script>
// Z-score table at the back of an exam (owner 17 Nov: "Some questions say refer to the z score table at the back of the exam.
// For THOSE specifically, we arenot adding the z score table in ... We need a way to append a z score table at the back of
// exams which ahve those questions tho." and "Questions which have a pportion of the ztable in there arleady we will keep.").
// A question needs it when the bank marks it (q.zt, from state/work/ztable.json via build_bank.py) or Review sets reviews.zt;
// an explicit zt:false in Review overrides the bank. The values are computed here (P(Z <= z), 4 dp), not copied from a paper.
const needsZ=q=>{const v=reviews['q'+q.id]?.zt;return v===undefined?!!q?.zt:!!v};
const zPhi=z=>{const n=2000,h=z/n,f=t=>Math.exp(-t*t/2);let s=f(0)+f(z);   // Simpson's rule on the normal density: error < 1e-12
  for(let i=1;i<n;i++)s+=(i%2?4:2)*f(i*h);return 0.5+s*h/3/Math.sqrt(2*Math.PI)};
let zTabCache='';
function zTableHTML(){if(zTabCache)return zTabCache;
  const cols=[...Array(10).keys()],rows=[...Array(35).keys()];
  const head=`<tr><th><i>z</i></th>${cols.map(c=>`<th>0.0${c}</th>`).join('')}</tr>`;
  const body=rows.map(r=>`<tr><th>${(r/10).toFixed(1)}</th>${cols.map(c=>`<td>${zPhi(r/10+c/100).toFixed(4)}</td>`).join('')}</tr>`).join('');
  return zTabCache=`<div class="xztab"><div class="xsechd">Standard normal distribution table</div>
    <p>The table gives <i>P</i>(<i>Z</i> ≤ <i>z</i>), the area under the standard normal curve to the left of <i>z</i>, for <i>Z</i> ~ <i>N</i>(0, 1).
    For negative <i>z</i>, use <i>P</i>(<i>Z</i> ≤ −<i>z</i>) = 1 − <i>P</i>(<i>Z</i> ≤ <i>z</i>).</p>
    <table class="xzt"><thead>${head}</thead><tbody>${body}</tbody></table></div>`}
</script>
<script>

<script>
/* ===================== Exam builder stage 2: automatic (owner 14 Nov) =====================
   Owner: "can you begin building stage 2 of the exam builder in the background please? The one where it's an automatic one."
   Pick topics, total marks, the number of multiple-choice questions, a difficulty (Easier / HSC-like / Harder) and a fluency /
   problem-solving split; the generator fills the exam (EX.items), so preview, marking guide, save and download all keep working.
   Since the Exams page (24_exams.js) took over the settings and the generator, this file keeps only what that page and the
   bank share: question difficulty (qDiff), topic homes and tree, the seeded random, and Swap / Lock on the exam panel.
   (health pass 13 Nov: the stage-2 drawer UI and its generator were unused and removed; they are in git history.)
   Regenerate = new seed, same settings. Each question in the list can be swapped for the closest alternative or locked so that
   Regenerate keeps it. Difficulty comes from DIFFICULTY_SPEC (part band 2-6, wm UF/PR). Question band = marks-weighted mean of
   its parts' bands, rounded to 0.5; a question's problem-solving share = marks on PR parts / its marks. */
const XA_DEF=()=>({open:true,topen:true,topics:[],total:100,mcq:10,mcqSet:false,diff:'hsc',pr:30,approved:true,avoid:false,seed:0,locked:[],warns:[],tmix:null,tpr:null,ran:false});
function xa(){if(!EX.auto||typeof EX.auto!=='object')EX.auto=XA_DEF();const d=XA_DEF();for(const k in d)if(EX.auto[k]===undefined)EX.auto[k]=d[k];return EX.auto}
const xaSave=()=>{try{localStorage.setItem(XKEY,JSON.stringify(EX))}catch(e){}};
const XA_SWAPPED=new Set();

/* ---------- difficulty of a question ---------- */
const _qd=new Map();
function qDiff(q){if(_qd.has(q.id))return _qd.get(q.id);
  const ls=qLeaves(q).filter(p=>p.dif&&p.dif.b);let r=null;
  if(ls.length){const w=p=>+p.marks||(ls.length===1?(+q.marks||1):1);let sw=0,sb=0,spr=0;const mix=[0,0,0,0,0,0,0];
    ls.forEach(p=>{const m=w(p),b=Math.max(2,Math.min(6,+p.dif.b));sw+=m;sb+=m*b;if(p.dif.wm==='PR')spr+=m;mix[b]+=m});
    r={band:Math.round(sb/sw*2)/2,raw:sb/sw,pr:spr/sw,mix,w:sw}}
  _qd.set(q.id,r);return r}
const fmtBand=b=>Number.isInteger(b)?String(b):`${Math.floor(b)}–${Math.ceil(b)}`;
const wmName=pr=>pr<=0.001?'Fluency':pr>=0.999?'Problem solving':'Mixed';
// owner 12 Nov: no pills on bank cards; difficulty is plain text in the footer ("Band 3 · Fluency")
function qDifLabel(q){const d=qDiff(q);return d?`Band ${fmtBand(d.band)} · ${wmName(d.pr)}`:''}
function qDifOK(q,F){const band=F.band||'all',wm=F.wm||'all';if(band==='all'&&wm==='all')return true;const d=qDiff(q);if(!d)return false;
  if(band==='lo'&&d.band>3)return false;if(band==='mid'&&(d.band<3.5||d.band>4.5))return false;if(band==='hi'&&d.band<5)return false;
  if(wm!=='all'&&{uf:'Fluency',pr:'Problem solving',mix:'Mixed'}[wm]!==wmName(d.pr))return false;return true}

/* ---------- topics and pool ---------- */
let _xah=null,_xahR=null;
function xaHomes(){if(_xah&&_xahR===reviews)return _xah;const m=new Map();
  B.questions.forEach(q=>{if(q.dup_of||q.old||q.std||!(+q.marks>0))return;const h=qHome(q);if(!h||!h.startsWith('sub:'))return;const [yl,fa]=h.slice(4).split('|');m.set(q.id,{sub:h,area:yl+'|'+fa})});
  _xah=m;_xahR=reviews;return m}
let _xat=null;
function xaTree(){if(_xat)return _xat;const t={12:new Map(),11:new Map()};
  DOTS.forEach(d=>{const m=t[d.yl];if(!m)return;if(!m.has(d.fa))m.set(d.fa,[]);const k='sub:'+d.yl+'|'+d.fa+'|'+(d.sub||'');const a=m.get(d.fa);if(!a.includes(k))a.push(k)});return _xat=t}
const xaSavedIds=()=>{const s=new Set();try{(XSAVED||[]).forEach(x=>{if(x.id!==EX.id)(x.items||[]).forEach(i=>s.add(i))})}catch(e){}return s};

/* ---------- seeded random (the Exams page generator) ---------- */
function xaRng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

/* ---------- swap and lock ---------- */
function xaSwap(id){const A=xa(),q=xq(id);if(!q)return;const homes=xaHomes(),h=homes.get(id),d=qDiff(q),TS=new Set(A.topics);XA_SWAPPED.add(id);
  const avoid=A.avoid?xaSavedIds():null;
  const cands=B.questions.filter(c=>homes.has(c.id)&&c.type===q.type&&!EX.items.includes(c.id)&&!XA_SWAPPED.has(c.id)&&qDiff(c)&&(!A.approved||qState(c)==='approved')&&!(avoid&&avoid.has(c.id)));
  if(!cands.length){toast('No other question fits');return}
  const sc=c=>{const hc=homes.get(c.id),dc=qDiff(c);return (h&&hc.sub===h.sub?0:h&&hc.area===h.area?3:TS.has(hc.sub)?6:12)+2*Math.abs((+c.marks||0)-(+q.marks||0))+1.5*Math.abs(dc.raw-(d?d.raw:3))+Math.abs(dc.pr-(d?d.pr:0))+Math.random()*.3};
  let best=null,bs=1e9;cands.forEach(c=>{const v=sc(c);if(v<bs){bs=v;best=c}});
  EX.items[EX.items.indexOf(id)]=best.id;xsave();toast(`Swapped for ${qid(best)}${best.marks!==q.marks?` (${best.marks} marks instead of ${q.marks})`:''}`)}
function xaLock(id){const A=xa(),i=A.locked.indexOf(id);if(i>=0)A.locked.splice(i,1);else A.locked.push(id);xaSave();xPanel()}

/* ---------- swap / lock on the exam panel (xPanel in 20_exam.js) ---------- */
const XA_LOCK='<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5.2 7V5.2a2.8 2.8 0 0 1 5.6 0V7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
document.addEventListener('click',e=>{if(!e.target.closest('#xPanel'))return;
  const li=e.target.closest('li[data-xi]');
  if(li&&e.target.closest('[data-xsw]')){const b=e.target.closest('[data-xsw]');if(!b.disabled)xaSwap(+li.dataset.xi);return}
  if(li&&e.target.closest('[data-xlk]')){xaLock(+li.dataset.xi);return}
});
</script>
<script>
/* ===================== Exams page (owner 14 Nov) =====================
   owner 14 Nov: "Making the exam should be on another page, and it should operate similar to the html file I gave you."
   He chose: a new tab in Questgen; all of Setup page, Preview + grading panel, Edit on the paper, Pick by hand view.
   Mirrors his HSC Advanced Exam Maker: Exam setup (topic tiles, sliders, availability table, Generate) | Pick by hand
   (topics | question cards | exam panel), and a full-screen A4 preview with a grading panel, Fit pages, Regenerate, Swap,
   editable cover, answer lines and diagram sizes. The side drawer from stage 1/2 is replaced: the header "Exam · N" pill
   now opens this page. Difficulty: band 2-6 and fluency (UF) / problem solving (PR) per part, from DIFFICULTY_SPEC. */
const EXV={view:(()=>{try{return localStorage.getItem('ex_view')||'setup'}catch(e){return 'setup'}})(),
  pk:{topic:'all',q:'',paper:'all',type:'all',marks:'all',sort:'new',band:'all',wm:'all',fig:false,hide:false,limit:20},
  open:new Set(),pkOpen:new Set(),sel:null,doc:'exam',grade:true,fit:false,fitMsg:false,built:false,moved:null};
const exSaveView=()=>{try{localStorage.setItem('ex_view',EXV.view)}catch(e){}};

/* ---------- settings (kept in EX.auto with the stage-2 fields) ---------- */
function exA(){const A=xa();if(!A.src||typeof A.src!=='object')A.src={hsc:true,trial:true,school:true};
  // owner 14 Nov: "remove Skip questions used in my other saved exams for now" - the option is gone and never applied
  A.avoid=false;
  if(A.dF==null)A.dF=3.2;if(A.dP==null)A.dP=4.2;if(A.title==null)A.title='';if(A.last===undefined)A.last=null;
  if(!EX.lines||typeof EX.lines!=='object')EX.lines={};if(!EX.figscale||typeof EX.figscale!=='object')EX.figscale={};return A}
const exSrc=q=>{const t=B.docs[q.doc]?.task_type;return t==='hsc'?'hsc':t==='trial'?'trial':'school'};
const EX_SRC=[['hsc','NESA HSC'],['trial','Trials'],['school','School exams']];
// owner 14 Nov ("make it more sophisticated"): plain "Band 4.2" labels; the Solid/Strong words are gone
const dLab=b=>'Band '+(+b).toFixed(1);

/* ---------- per-question estimate from the part ratings ---------- */
const _ee=new Map();
function exPath(q,p){const by=new Map(q.parts.map(y=>[y.id,y]));const c=[];let x=p;while(x){if(x.label)c.unshift('('+x.label+')');x=x.parent?by.get(x.parent):null}return c.join('')}
function exEst(q){if(_ee.has(q.id))return _ee.get(q.id);
  const ls=qLeaves(q).filter(p=>p.dif&&p.dif.b);let r=null;
  if(ls.length){const w=p=>+p.marks||(ls.length===1?(+q.marks||1):1);const sw=ls.reduce((t,p)=>t+w(p),0)||1,k=(+q.marks||sw)/sw;
    let fl=0,ps=0,wF=0,wP=0;
    const parts=ls.map(p=>{const m=w(p)*k,b=Math.max(2,Math.min(6,+p.dif.b)),isP=p.dif.wm==='PR';if(isP){ps+=m;wP+=m*b}else{fl+=m;wF+=m*b}
      return {id:p.id,lab:exPath(q,p),m,b,ps:isP,r:p.dif.r||''}});
    const m=fl+ps;r={m,fl,ps,dF:fl?wF/fl:null,dP:ps?wP/ps:null,d:(wF+wP)/(m||1),kind:ps<=1e-9?'Fluency':fl<=1e-9?'Problem solving':'Mixed',parts}}
  _ee.set(q.id,r);return r}
const fmtM=m=>Number.isInteger(m)?String(m):String(+m.toFixed(1));

/* ---------- pool ---------- */
function exBase(A,homes){const avoid=A.avoid?xaSavedIds():null;
  return B.questions.filter(q=>homes.has(q.id)&&exEst(q)&&A.src[exSrc(q)]&&(!A.approved||qState(q)==='approved')&&!(avoid&&avoid.has(q.id)))}
function exPool(A,homes){const T=new Set(A.topics);return exBase(A,homes).filter(q=>T.has(homes.get(q.id).sub))}
const subName=k=>k.split('|')[2]||k.slice(4).split('|')[1];
function exAutoTitle(A){const tree=xaTree(),sel=new Set(A.topics),fas=[];
  [12,11].forEach(y=>tree[y].forEach((ks,fa)=>{const s=ks.filter(k=>sel.has(k));if(s.length)fas.push({fa,s,all:ks.length})}));
  if(!fas.length)return QG.courseData.name+' practice';
  if(fas.length===1){const f=fas[0];return f.s.length===1&&f.all>1?subName(f.s[0]):f.fa}
  if(fas.length===2)return fas[0].fa+' and '+fas[1].fa.charAt(0).toLowerCase()+fas[1].fa.slice(1);
  return 'Mixed topics'}

/* ---------- generator (stage 2's seeded greedy fill + improvement moves; cost now uses separate fluency and
   problem-solving difficulty targets, like the owner's exam maker) ---------- */
function exStats(S,homes,T){let marks=0,mcq=0,fl=0,ps=0,wF=0,wP=0,dev=0;const area={};
  for(const q of S){const e=exEst(q);if(!e)continue;const m=+q.marks||e.m;marks+=m;if(q.type==='mcq')mcq++;fl+=e.fl;ps+=e.ps;
    for(const p of e.parts){if(p.ps){wP+=p.b*p.m;if(T)dev+=p.m*Math.abs(p.b-T.dP)}else{wF+=p.b*p.m;if(T)dev+=p.m*Math.abs(p.b-T.dF)}}
    const h=homes.get(q.id);if(h)area[h.area]=(area[h.area]||0)+m}
  return {marks,mcq,fl,ps,dF:fl?wF/fl:null,dP:ps?wP/ps:null,dev:dev/((fl+ps)||1),area}}
function exCost(st,T){let c=0;if(T.full)c+=20*Math.abs(st.marks-T.total)+20*Math.abs(st.mcq-T.mcq);
  const tm=(st.fl+st.ps)||1;c+=6*Math.abs(st.ps/tm-T.s);
  if(st.dF!=null)c+=2*Math.abs(st.dF-T.dF)*(st.fl/tm);if(st.dP!=null)c+=2*Math.abs(st.dP-T.dP)*(st.ps/tm);
  c+=.25*st.dev;let al=0;const mk=st.marks||1;for(const a in T.area)al+=Math.abs((st.area[a]||0)/mk-T.area[a]);return c+2*al}
function exGenerate(){const A=exA();if(!A.topics.length){toast('Choose at least one subtopic first');return null}
  const homes=xaHomes(),pool=exPool(A,homes);
  const locked=A.locked.filter(i=>EX.items.includes(i)).map(xq).filter(Boolean);A.locked=locked.map(q=>q.id);const lockedIds=new Set(A.locked);
  const mcqP=pool.filter(q=>q.type==='mcq'&&!lockedIds.has(q.id)),wrP=pool.filter(q=>q.type!=='mcq'&&!lockedIds.has(q.id));
  if(!mcqP.length&&!wrP.length&&!locked.length){toast('No questions match. Choose more topics or papers.');return null}
  const T={total:A.total,mcq:A.mcq,s:A.pr/100,dF:A.dF,dP:A.dP,area:{},full:false};
  pool.forEach(q=>{const a=homes.get(q.id).area;T.area[a]=(T.area[a]||0)+(+q.marks||0)});{const s=Object.values(T.area).reduce((a,b)=>a+b,0)||1;for(const k in T.area)T.area[k]/=s}
  A.seed=(Math.random()*2**31)>>>0;const R=xaRng(A.seed);
  let S=[...locked];const used=new Set(S.map(q=>q.id));
  const cost=sel=>exCost(exStats(sel,homes,T),T);
  const sample=(arr,n,f)=>{const out=[];for(let t=0;t<n*4&&out.length<n&&arr.length;t++){const q=arr[Math.floor(R()*arr.length)];if(!used.has(q.id)&&(!f||f(q))&&!out.includes(q))out.push(q)}return out};
  const greedy=c=>{let best=null,bc=1e9;c.forEach(q=>{const v=cost([...S,q])+R()*.03;if(v<bc){bc=v;best=q}});S.push(best);used.add(best.id)};
  const needM=Math.max(0,A.mcq-locked.filter(q=>q.type==='mcq').length);
  for(let k=0;k<needM;k++){const c=sample(mcqP,24);if(!c.length)break;greedy(c)}
  const marks=()=>S.reduce((t,q)=>t+(+q.marks||0),0);
  for(let g=0;g<300;g++){const rem=A.total-marks();if(rem<=0)break;const c=sample(wrP,30,q=>q.marks<=rem);if(!c.length)break;greedy(c)}
  T.full=true;const byM={};wrP.forEach(q=>{(byM[q.marks]=byM[q.marks]||[]).push(q)});
  let cur=cost(S),best=S.slice(),bestC=cur;const N_IT=900;
  for(let it=0;it<N_IT;it++){const temp=.06*(1-it/N_IT),diff=A.total-marks(),free=S.filter(q=>!lockedIds.has(q.id)),r=R();let N=null;
    if(diff>0&&r<.25){const c=(byM[diff]||[]).filter(q=>!used.has(q.id));if(c.length)N=[...S,c[Math.floor(R()*c.length)]]}
    else if(diff<0&&r<.25){const c=free.filter(q=>q.type!=='mcq'&&q.marks<=-diff);if(c.length){const x=c[Math.floor(R()*c.length)];N=S.filter(q=>q!==x)}}
    if(!N&&free.length){const x=free[Math.floor(R()*free.length)],isM=x.type==='mcq';let c=null;
      if(!isM&&R()<.5)c=(byM[x.marks+diff]||[]).filter(q=>!used.has(q.id));
      if(!c||!c.length)c=sample(isM?mcqP:wrP,6);
      if(c.length){const y=c[Math.floor(R()*c.length)];N=S.map(q=>q===x?y:q)}}
    if(!N)continue;const nc=cost(N);
    if(nc<cur||(temp>0&&R()<Math.exp((cur-nc)/temp))){S=N;cur=nc;used.clear();S.forEach(q=>used.add(q.id));if(cur<bestC){bestC=cur;best=S.slice()}}}
  S=best;
  const bo=q=>exEst(q)?.d??3;   // HSC order: easier first within each section
  const mc=S.filter(q=>q.type==='mcq').sort((a,b)=>bo(a)-bo(b)),wr=S.filter(q=>q.type!=='mcq').sort((a,b)=>bo(a)-bo(b)||a.marks-b.marks);
  EX.items=[...mc,...wr].map(q=>q.id);EX.sub=A.title||exAutoTitle(A);
  const st=exStats(S,homes,null);A.ran=true;A.tpr=T.s;
  A.last={n:S.length,marks:st.marks,F:st.fl,P:st.ps,dF:st.dF,dP:st.dP,nM:st.mcq,topics:new Set(S.map(q=>homes.get(q.id)?.sub).filter(Boolean)).size,chosen:A.topics.length,warns:exWarn(A,st,pool)};
  A.warns=A.last.warns;XA_SWAPPED.clear();EXV.fit=true;xsave();return A.last}
function exWarn(A,st,pool){const w=[],mN=pool.filter(q=>q.type==='mcq').length,wM=pool.filter(q=>q.type!=='mcq').reduce((t,q)=>t+(+q.marks||0),0);
  if(st.mcq<A.mcq)w.push(`Only ${mN} multiple-choice question${mN===1?'':'s'} match these topics, so Section I has ${st.mcq}.`);
  if(st.marks!==A.total)w.push(wM<A.total-A.mcq?`These topics only have ${wM} marks of written questions, so the exam has ${st.marks} marks instead of ${A.total}. Add topics or lower the total.`:`The closest found is ${st.marks} marks (target ${A.total}). Press Regenerate, or add a topic.`);
  const tm=(st.fl+st.ps)||1,s=A.pr/100;
  if(st.ps/tm<s-.07)w.push(`Problem solving is ${Math.round(st.ps/tm*100)}% of the marks, against ${A.pr}%: these topics are short of problem-solving parts.`);
  else if(st.ps/tm>s+.1)w.push(`Problem solving is ${Math.round(st.ps/tm*100)}% of the marks, more than the ${A.pr}% asked for: these topics have few fluency-only questions.`);
  if(st.dF!=null&&Math.abs(st.dF-A.dF)>.4)w.push(`Fluency marks average band ${st.dF.toFixed(1)}, against ${A.dF.toFixed(1)}: these topics have few fluency parts ${st.dF<A.dF?'that hard':'that easy'}.`);
  if(st.dP!=null&&Math.abs(st.dP-A.dP)>.4)w.push(`Problem-solving marks average band ${st.dP.toFixed(1)}, against ${A.dP.toFixed(1)}: these topics have few problem-solving parts ${st.dP<A.dP?'that hard':'that easy'}.`);
  return w}

/* ---------- page shell ---------- */
// owner 14 Nov ("Is there a place to manage created exams?"): a third view, My exams (25_mine.js), beside Exam setup and Pick by hand
function renderExams(){const box=$('#examsView');if(!box||!B)return;exmSub();exA();
  if(!EXV.built){EXV.built=true;
    box.innerHTML=`<div class="exhead"><div class="xseg exseg" role="group" aria-label="Exams"><button type="button" data-exv="setup">Exam setup</button><button type="button" data-exv="pick">Pick by hand</button><button type="button" data-exv="mine">My exams</button></div>
      <span class="exsum" id="exSum"></span><span class="sp"></span>
      <button type="button" class="act exnarrow-s" id="exTopicsBtn" aria-controls="exSide">Topics</button>
      <button type="button" class="act exnarrow" id="exExamBtn" aria-controls="exRight">Exam · <span id="exExamN">0</span></button>

const exMeter=(d,k)=>`<span class="exmeter ${kindCls(k)}" aria-label="Band ${d.toFixed(1)}">${[2,3,4,5,6].map(i=>`<i class="${Math.round(d)>=i?'on':''}"></i>`).join('')}</span>`;
function exGrading(){const el=$('#exGSide');if(!el)return;const qs=EX.items.map(xq).filter(Boolean);let F=0,P=0,wF=0,wP=0;
  qs.forEach(q=>{const e=exEst(q);if(!e)return;F+=e.fl;P+=e.ps;wF+=(e.dF||0)*e.fl;wP+=(e.dP||0)*e.ps});
  const split=qs.some(q=>q.type==='mcq')&&qs.some(q=>q.type!=='mcq'),sec=q=>q.type==='mcq'?1:2;
  // owner 14 Nov: "The dot point home looks stupid in a question": the dot points moved off the paper into this detail (and the
  // paper's ⓘ card), "where they belong"
  const gdots=q=>`<div class="gdots"><b>Dot points</b>${qiDotsList(q,'gdotl')}</div>`;
  const det=q=>{const e=exEst(q);if(!e)return `<div class="gdet"><div class="gsrc">${esc(srcLine(q))} · ${qid(q)}</div><div class="glab">Not rated yet.</div>${gdots(q)}</div>`;const multi=e.parts.length>1;
    return `<div class="gdet"><div class="gsrc">${esc(srcLine(q))} · ${qid(q)} · ${q.marks} mark${q.marks===1?'':'s'}</div>
      <div class="glab">Band ${e.d.toFixed(1)} overall · ${fmtM(e.fl)} fluency, ${fmtM(e.ps)} problem-solving mark${e.ps===1?'':'s'}</div>${gdots(q)}
      <table class="gparts"><thead><tr><th>Part</th><th>Marks</th><th>Kind</th><th>Band</th></tr></thead><tbody>${e.parts.map(x=>`<tr><td>${esc(x.lab||'Whole')}</td><td>${fmtM(x.m)}</td><td>${x.ps?'Problem solving':'Fluency'}</td><td>${x.b}</td></tr>`).join('')}</tbody></table>
      <div class="gwhy"><b>Why it was rated this way</b><ul>${e.parts.filter(x=>x.r).map(x=>`<li>${multi&&x.lab?`<span class="pp">${esc(x.lab)}</span> `:''}${esc(x.r)}</li>`).join('')||'<li>No reason recorded.</li>'}</ul></div>
      <div class="gacts"><button type="button" class="act" data-gswap="${q.id}">Swap for a similar question</button></div></div>`};
  el.innerHTML=`<div class="gtop"><h3>Question grading</h3><button type="button" class="linkbtn" id="exGClose">Hide</button></div><div class="gsub">Click a question on the paper, or in this list.</div>
    <div class="gsum"><div class="f"><b>${fmtM(F)} marks</b>Fluency${F?` · average band ${(wF/F).toFixed(1)}`:''}</div><div class="p"><b>${fmtM(P)} marks</b>Problem solving${P?` · average band ${(wP/P).toFixed(1)}`:''}</div></div>
    <div class="gsub" style="margin:-4px 0 8px">Drag a row to change the order on the paper.</div>
    <ol class="glist">${qs.map((q,i)=>{const e=exEst(q),s=EXV.sel===q.id,first=i===0||sec(qs[i-1])!==sec(q),last=i===qs.length-1||sec(qs[i+1])!==sec(q);
      const head=split&&first?`<li class="gsec">Section ${sec(q)===1?'I · multiple choice':'II · written'}</li>`:'';const k=e?e.kind:'Fluency';
      return `${head}<li class="gq${s?' sel':''}${EXV.moved===q.id?' moved':''}" data-gqli="${q.id}"><div class="gqrow" draggable="true" data-drag="${q.id}"><span class="grip" aria-hidden="true" title="Drag to reorder">⋮⋮</span>
        <button type="button" class="gqh" data-gq="${q.id}" aria-expanded="${s}"><span class="exgn">Q${i+1}</span><span class="exgk ${kindCls(k)}">${k==='Problem solving'?'Problem':k}</span>${e?exMeter(e.d,k):'<span></span>'}<span class="exgd">${q.marks}</span></button>
        <span class="gmv"><button type="button" data-gmv="-1" data-id="${q.id}" aria-label="Move up"${first?' disabled':''}>▲</button><button type="button" data-gmv="1" data-id="${q.id}" aria-label="Move down"${last?' disabled':''}>▼</button></span></div>${s?det(q):''}</li>`}).join('')}</ol>
    <div class="gnote">Bands run from 2 to 6, as in the HSC. Each part was rated against HSC reference parts checked by an editor (Curate › Review › Difficulty). To question a rating, use Report in a question\u2019s ⓘ card.</div>`;
  $$('#xPages .xq').forEach(x=>x.classList.toggle('sel',+x.dataset.q===EXV.sel))}
function exSelect(id,from){EXV.sel=EXV.sel===id&&from==='list'?null:id;exGrading();
  if(from==='paper'&&innerWidth<=1000&&!EXV.grade){EXV.grade=true;$('#xPv')?.classList.remove('grade-off');$('#exGrade')?.setAttribute('aria-pressed','true')}
  // scroll the overlay / the panel themselves (scrollIntoView can shift the whole viewport on phones)
  const beh=RM.matches?'auto':'smooth',ov=$('#xPv'),side=$('#exGSide');
  if(from==='list'&&EXV.sel){const el=$(`#xPages .xq[data-q="${id}"]`);if(el&&ov){const tb=ov.querySelector('.xtool')?.offsetHeight||0;ov.scrollTo({top:ov.scrollTop+el.getBoundingClientRect().top-ov.getBoundingClientRect().top-tb-12,behavior:beh})}}
  else{const li=$(`#exGSide [data-gqli="${id}"]`);if(li&&side){const r=li.getBoundingClientRect(),sr=side.getBoundingClientRect();if(r.top<sr.top||r.bottom>sr.bottom)side.scrollTo({top:side.scrollTop+r.top-sr.top-60,behavior:beh})}}}
function exOrder(ord,id){EX.items=ord;EXV.moved=id;xsave();exRelayout();clearTimeout(exOrder._t);exOrder._t=setTimeout(()=>{EXV.moved=null},900)}
function exMove(id,d){const qs=EX.items.map(xq).filter(Boolean),i=qs.findIndex(q=>q.id===id),j=i+d;if(j<0||j>=qs.length)return;
  if((qs[i].type==='mcq')!==(qs[j].type==='mcq')){toast('Multiple-choice questions stay in Section I.');return}
  const ord=qs.map(q=>q.id);[ord[i],ord[j]]=[ord[j],ord[i]];exOrder(ord,id)}
function exDrop(id,tid,after){if(id===tid)return;const a=xq(id),b=xq(tid);if(!a||!b)return;if((a.type==='mcq')!==(b.type==='mcq')){toast('Multiple-choice questions stay in Section I.');return}
  const ord=EX.items.filter(x=>x!==id);ord.splice(ord.indexOf(tid)+(after?1:0),0,id);exOrder(ord,id)}

// drag the corner handle to resize a diagram (owner 14 Nov: "it should just be drag the corner in and out diagonally").
// Pointer events, so mouse, pen and touch all work. The diagram is centred, so its bottom-right corner moves half as far
// sideways as the diagram grows; the scale is the least-squares fit that keeps that corner under the pointer. While dragging only
// --fs and the live % change (one rAF per frame); the paper is laid out again (exRelayout) once, when the drag ends.
let EXFR=null,EXFTAP=null;
const exFigSet=(w,s)=>{const p=Math.round(s*100);w.style.setProperty('--fs',s);const c=w.querySelector('.figpct');if(c)c.textContent=p+'%';
  const h=w.querySelector('.figh');if(h){h.setAttribute('aria-valuenow',p);h.setAttribute('aria-valuetext',p+'%')}};
// fix 13 Nov (exam pools): a resized diagram can move to the next page when the paper is laid out again; it then jumped off
// screen, so the next drag on its corner found nothing under the pointer ("scale 1.32 → 1.32"). The paper now scrolls so the
// diagram's top edge stays where it was on screen (a diagram grows down from its top, so when it stays on its page nothing moves).
const exFigKeep=(k,p)=>{const ov=$('#xPv'),q=()=>document.querySelector(`#xPages [data-figw="${k}"] .exfigbox`),el=q();if(!ov||!el)return p;const t0=el.getBoundingClientRect().top;
  return Promise.resolve(p).then(()=>{const e2=q();if(e2)ov.scrollTop+=e2.getBoundingClientRect().top-t0})};
const exFigCommit=(k,s)=>{s=Math.round(Math.max(.3,Math.min(2,s))*100)/100;if(s===(EX.figscale[k]||1))return false;if(s===1)delete EX.figscale[k];else EX.figscale[k]=s;xsave();exFigKeep(k,exRelayout());return true};
const exFigReset=k=>{if(!(k in EX.figscale))return;delete EX.figscale[k];xsave();exFigKeep(k,exRelayout());toast('Diagram back to 100%')};
// fix 13 Nov (exam pools): a diagram is never drawn wider than the column (max-width), so a scale past that point changed nothing
// on the paper, and dragging in from there did nothing visible either. The size at 100% is measured (not divided out of a drawn
// size that may be capped) and the largest scale is the one that fills the column (at most 200%).
const exFigBase=w=>{const b=w.querySelector('.exfigbox'),old=w.style.getPropertyValue('--fs');w.style.setProperty('--fs','1');const r=b.getBoundingClientRect();w.style.setProperty('--fs',old);
  const col=w.getBoundingClientRect().width;return {w0:r.width||100,h0:r.height||100,smax:r.width>0&&col>0?Math.max(1,Math.min(2,Math.floor(col/r.width*100)/100)):2}};
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('#xPv [data-figh]');if(!h||e.button>0)return;e.preventDefault();e.stopPropagation();
  const w=h.closest('.exfigw'),B=exFigBase(w),s0=Math.min(B.smax,EX.figscale[h.dataset.figh]||1);
  EXFR={k:h.dataset.figh,w,h,x:e.clientX,y:e.clientY,s0,s:s0,w0:B.w0,h0:B.h0,smax:B.smax,raf:0,moved:false};
  try{h.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{const f=EXFR;if(!f)return;const dx=e.clientX-f.x,dy=e.clientY-f.y;
  if(!f.moved){if(Math.hypot(dx,dy)<3)return;f.moved=true;f.w.classList.add('resizing');document.body.classList.add('fig-resizing')}
  const a=f.w0/2,b=f.h0;f.s=Math.max(.3,Math.min(f.smax,f.s0+(dx*a+dy*b)/(a*a+b*b||1)));f.s=Math.round(f.s*100)/100;
  if(!f.raf)f.raf=requestAnimationFrame(()=>{f.raf=0;exFigSet(f.w,f.s)})});
const exFigEnd=()=>{const f=EXFR;if(!f)return;EXFR=null;if(f.raf)cancelAnimationFrame(f.raf);f.w.classList.remove('resizing');document.body.classList.remove('fig-resizing');
  if(f.moved){EXFTAP=null;exFigSet(f.w,f.s);exFigCommit(f.k,f.s);return}
  // a tap without a drag: two within 350 ms is a double-tap (touch screens fire no dblclick), so reset
  const now=performance.now();if(EXFTAP&&EXFTAP.k===f.k&&now-EXFTAP.t<350){EXFTAP=null;exFigReset(f.k)}else EXFTAP={k:f.k,t:now}};
document.addEventListener('pointerup',exFigEnd);document.addEventListener('pointercancel',exFigEnd);
document.addEventListener('dblclick',e=>{const h=e.target.closest&&e.target.closest('#xPv [data-figh]');if(!h)return;e.preventDefault();EXFTAP=null;exFigReset(h.dataset.figh)});
// keyboard: arrows step 5%, Home resets; the paper is laid out again once the keys go quiet
let EXFKEY=null;
document.addEventListener('keydown',e=>{const h=e.target.closest&&e.target.closest('#xPv [data-figh]');if(!h)return;
  const d={ArrowRight:.05,ArrowUp:.05,ArrowLeft:-.05,ArrowDown:-.05}[e.key];if(d==null&&e.key!=='Home')return;e.preventDefault();e.stopPropagation();

<script>
/* ===================== Question reports (owner 14 Nov, alpha) =====================
   owner 14 Nov: "since this is currently in alpha, it would be good to see each question's dot point somewhere in the exam
   paper page and an ability to report this question for wrong difficulty, wrong dot point and have it come up in a new
   review tab."
   - On the on-screen paper (exam and marking guide) each question's source line ends with an ⓘ (owner 14 Nov: "The dot point
     home looks stupid in a question" / "the i is fine") that opens its dot point(s), band, kind and Report. It carries
     .scr-only, so the download, PDF, Word and print leave it out (like the line and diagram controls).
   - Report opens a small form: Wrong difficulty (optional band 2-6), Wrong dot point (optional pick or free text), Other,
     and a note. One doc per report in the page database, collection `reports`:
     {question_id, part_id?, reason: difficulty|dot_point|other, suggested_band?, suggested_wm?, suggested_dot?, note, exam_id?, by, at, status:'open'}
     suggested_wm: 'UF' (fluency) | 'PR' (problem solving), owner 14 Nov: "Should let you pick UF and PS in the wrong diff".
   - A Reports tab (#reports) lists them with the question rendered; Resolve (optional reply) and Dismiss; a count badge
     on the tab shows open reports. (15 Nov: now the Reports step inside Review, #review/reports, with its count on the step.) */
const REP={list:[],sub:null,filter:(()=>{try{return localStorage.getItem('rep_filter')||'open'}catch(e){return 'open'}})(),dlg:null,res:null,names:{}};
const REP_WHY={difficulty:'Wrong difficulty',dot_point:'Wrong dot point',other:'Other'};
const REP_WM={UF:'Fluency',PR:'Problem solving'};
function repSub(){if(REP.sub||!db)return !!REP.sub;
  try{REP.sub=db.collection('reports').onSnapshot(s=>{const d=s.docs||s;REP.list=(d||[]).map(x=>({id:x.id,...(typeof x.data==='function'?x.data():x.data)})).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
    repBadge();repNames();if(view==='reports')renderReports();repMarkPaper();
    try{const xp=$('#xPanel');if(xp&&!xp.hidden&&typeof xPanel==='function')xPanel();if(view==='exams'&&typeof renderMine==='function'&&EXV?.view==='mine')renderMine()}catch(_){}   // owner 17 Nov: exam warnings follow new reports
  },()=>{})}catch(e){REP.sub=null}return !!REP.sub}
// db arrives asynchronously (claude.use('db')); subscribe as soon as it exists
(()=>{let n=0;const t=setInterval(()=>{if(repSub()||++n>240)clearInterval(t)},500)})();
const repOpen=()=>REP.list.filter(r=>(r.status||'open')==='open');
// owner 17 Nov: "that needs a way for it to be shown in the exam if it has been reported by teachers or put back in review by [the
// checker]": a question in an exam is marked when it has an open report or is flagged (incl. a diagram change request) since.
function qWatch(q){if(!q)return null;const back=typeof qState==='function'&&qState(q)==='flagged';
  const ids=new Set([q.id,q.dup_of].filter(Boolean)),n=repOpen().filter(r=>ids.has(r.question_id)||(q.key&&r.key===q.key)).length;
  if(!back&&!n)return null;return {back,n,text:[back?'sent back to review':'',n?(n===1?'reported by a teacher':`reported ${n} times`):''].filter(Boolean).join(' · ')}}
// owner 15 Nov: Reports is a step inside Review; its count is on the step (was the tab badge #repN)
// owner 13 Nov: the count is on the Inbox's Reports card and in the Review tab / Curate switch totals
function repBadge(){if(typeof renderSteps==='function')renderSteps()}
async function repNames(){const ids=[...new Set(REP.list.map(x=>x.by).filter(i=>i&&i!==me&&!(i in REP.names)))];if(!ids.length)return;
  try{const u=await window.claude?.use?.('user');if(!u?.profiles)return;const ps=await u.profiles(ids);ids.forEach(i=>REP.names[i]=ps?.[i]?.name||'');if(view==='reports')renderReports()}catch(e){}}
const repWho=id=>!id?'':id===me?'you':(REP.names[id]||'a colleague');

/* ---------- dot points of a question (main dot point of each leaf part, as the Bank files it) ---------- */
function repDots(q){const lv=qLeaves(q),multi=lv.length>1,seen=new Map();
  lv.forEach(p=>effTags(q,p).filter(t=>t.primary).forEach(t=>{const k=t.cov==='removed'?'removed':t.cov==='no_match'?'no_match':t.id;if(!k)return;
    if(!seen.has(k))seen.set(k,[]);if(p.label)seen.get(k).push(p.label)}));
  return [...seen.entries()].map(([k,labs])=>{const d=DM[k];const lab=multi&&labs.length&&labs.length<lv.length?labs.map(l=>'('+l+')').join('')+' ':'';
    const txt=k==='removed'?'Removed from the 2024 syllabus':k==='no_match'?'No 2024 dot point':d?(d.short||d.text||''):'';
    return {k,lab,txt,code:d?k:''}})}
const repDotsHTML=q=>{const ds=repDots(q);return ds.length?ds.map(d=>`<span class="exdot">${esc(d.lab)}${d.code?`<b>${esc(d.code)}</b> `:''}${esc(d.txt)}</span>`).join('<span class="exsep"> · </span>'):'<span class="exdot">No dot point yet</span>'};

/* ---------- on the paper: an ⓘ on the source line, screen only ----------
   owner 14 Nov: "The dot point home looks stupid in a question", then, of the proposed ⓘ: "Yeah that's fine, the i is fine".
   The grey dot-point line and the Report link left the question. The ⓘ at the end of the source line ("2025 Sydney Girls … ·
   QID 1084  ⓘ") opens a small card: the dot point(s) per part (code and short text), each part's band and Fluency / Problem
   solving, and Report, which opens the report form. Esc or a click outside closes it; focus goes back to the ⓘ. The button
   carries .scr-only, so the download, PDF and Word leave it out, as they left out the old line. */
const QI_ICON='<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.25"/><circle cx="8" cy="4.9" r=".95" fill="currentColor"/><path d="M8 7.1v4.4" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/></svg>';
const qiLabel=k=>`Dot points, band and Report${k?` · ${k} open report${k===1?'':'s'}`:''}`;
function qiButton(q,n){const k=repOpen().filter(r=>r.question_id===q.id).length;
  return `<button type="button" class="exinfo scr-only${k?' has':''}" data-qinfo="${q.id}" data-n="${esc(String(n??''))}" aria-haspopup="dialog" aria-expanded="false" aria-label="${qiLabel(k)}" title="${qiLabel(k)}">${QI_ICON}</button>`}
// each leaf part: its label (when there are several), main dot point(s), band and kind, as the Bank files and rates it
function qiParts(q){const e=typeof exEst==='function'?exEst(q):null,lv=qLeaves(q);
  return lv.map(p=>{const ep=e?.parts.find(x=>x.id===p.id),seen=new Set();
    const dots=effTags(q,p).filter(t=>t.primary).map(t=>t.cov==='removed'?'removed':t.cov==='no_match'?'no_match':t.id).filter(k=>k&&!seen.has(k)&&seen.add(k)).map(k=>{const d=DM[k];
      return {code:d?k:'',txt:k==='removed'?'Removed from the 2024 syllabus':k==='no_match'?'No 2024 dot point':d?(d.short||d.text||''):''}});
    const wm=ep?(ep.ps?'PR':'UF'):p.dif?.wm||null;
    return {lab:lv.length>1?((typeof exPath==='function'&&exPath(q,p))||(p.label?'('+p.label+')':'')):'',dots,b:ep?ep.b:(p.dif?.b??null),kind:wm?(wm==='PR'?'Problem solving':'Fluency'):''}})}
const qiDotHTML=d=>d.code||d.txt?`${d.code?`<b>${esc(d.code)}</b> `:''}${esc(d.txt)}`:'';
// the dot points as a list, for the card and the grading panel's question detail
const qiDotsList=(q,cls)=>{const ps=qiParts(q);if(!ps.some(p=>p.dots.length))return `<p class="${cls}-none">No dot point yet.</p>`;
  // owner 14 Nov ("the dot points in the grading panel"): parts filed under the same dot point(s) share one row, "(a)(b) Y12-285 …",
  // instead of repeating the same line under each part

<script>
/* ===================== PDF export (owner 14 Nov) =====================
   Owner: "make it so we can export pdfs from here. Find a way". The artifact frame cannot open the print dialog, but it can

const PDF_LIBS=[VENDOR+'html-to-image-1.11.11/dist/html-to-image.js',VENDOR+'jspdf-2.5.1/dist/jspdf.umd.min.js'];   // self-hosted (tools/vendor.py)

  c.querySelectorAll('[contenteditable]').forEach(e=>{e.removeAttribute('contenteditable');e.removeAttribute('title');if(e.classList.contains('ed-empty'))e.textContent=''});
  c.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));

  return c}
async function xPdf(doc){
  const btn=$('#xPdf'),info=$('#xInfo'),old=info?.textContent;const say=t=>{if(info)info.textContent=t};
  const dl=window.claude?.use?await window.claude.use('downloads'):null;if(!dl){toast('Downloading is not available in this view');return}

document.addEventListener('click',e=>{const b=e.target.closest('#xPdf');if(!b||b.disabled)return;e.preventDefault();xPdf($('#xDl')?.dataset.doc||EXV?.doc||'exam')});
</script>

    host=pdfClone();document.body.appendChild(host);if(typeof exRejoin==='function')exRejoin(host);

    const RIGHT=9638;   // right tab stop (twips) for marks: A4 width minus 2 cm margins

    // ---- maths ----
    const mathRun=async(mc)=>{maths++;const svg=mc.querySelector('svg');const tex=svg?.querySelector('g[data-mml-node="math"]')?.getAttribute('data-latex')||svg?.querySelector('[data-latex]')?.getAttribute('data-latex');const disp=mc.getAttribute('display')==='true';

      out.push(new Paragraph({children:[new TextRun({text:tx('.xschool').toUpperCase(),font:UI,size:20,bold:true,characterSpacing:40})],spacing:{after:360},border:{top:{style:BorderStyle.SINGLE,size:12,color:'111111',space:8}}}));

      const f=[...cv.querySelectorAll('.cv-fields>span')].map(s=>s.querySelector('em')?.textContent||s.textContent);
      const fc=(l)=>new TableCell({children:[new Paragraph({children:[new TextRun({text:l.toUpperCase(),font:UI,size:16,color:'555555'})],spacing:{before:240,after:20}})],borders:{top:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},left:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},right:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},bottom:{style:BorderStyle.SINGLE,size:6,color:'111111'}}});
      const rowsF=[];for(let i=0;i<f.length;i+=2)rowsF.push(new TableRow({children:[fc(f[i]),new TableCell({children:[new Paragraph('')],borders:{top:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},bottom:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},left:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},right:{style:BorderStyle.NONE,size:0,color:'FFFFFF'}},width:{size:6,type:WidthType.PERCENTAGE}}),fc(f[i+1]||'')]}));

      if(st.length)out.push(new Table({rows:[new TableRow({children:st})],width:{size:100,type:WidthType.PERCENTAGE}}),new Paragraph({children:[],spacing:{after:240}}));
      const g=cv.querySelector('.cv-grid');if(g){let lab='';for(const c of g.children){if(c.matches('.cv-k')){const sm=c.querySelector('small');lab=sm?[...c.childNodes].filter(n=>n!==sm).map(n=>n.textContent).join('').trim()+' – '+sm.textContent.trim():c.textContent.trim();out.push(new Paragraph({children:[new TextRun({text:lab,font:UI,size:20,bold:true})],spacing:{before:160,after:60},keepNext:true}))}else await blocks(c,{font:FONT},out)}}
      const tt=cv.querySelector('.extopictbl')||host.querySelector('.cvcont .extopictbl');if(tt){   // a too-tall cover's table sits on the next page in the preview (24_exams.js); Word keeps it on the cover

    const title=`${EX.sub||EX.title||'Exam'}${doc==='guide'?' – marking guide':''}`;

        footers:{default:new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:`${EX.title||''} · ${EX.sub||''}${doc==='guide'?' · marking guide':''}    `,font:UI,size:16,color:'777777'}),new TextRun({children:[PageNumber.CURRENT],font:UI,size:16,color:'777777'})]})]})},
        children:body}]});

<script>
// owner 13 Nov: "add a place somewhere for me to write down what to flesh out next"
/* ---------- Next up notes (owner 13 Nov: "add a place somewhere for me to write down what to flesh out next") ----------
   A "Next up" card on Processes (Curate, so editors only). db collection "notes", one doc per note:
   {text, order, done, by, at}. Open notes in `order`; ticked ones move to a collapsed "Done" list. Reorder by dragging
   (desktop) or the ↑ ↓ buttons; delete asks inline (no confirm()). Only editors write: every handler checks isOwnerV().
   Claude reads this list (ArtifactData list on "notes") when asked what to build next. */
const NOTES={list:[],sub:null,loaded:false,del:null};
const notesOpen=()=>NOTES.list.filter(n=>!n.done).sort((a,b)=>(+a.order||0)-(+b.order||0)||String(a.at).localeCompare(String(b.at)));
const notesDone=()=>NOTES.list.filter(n=>n.done).sort((a,b)=>String(b.doneAt||b.at).localeCompare(String(a.doneAt||a.at)));
function notesSubscribe(){if(NOTES.sub||!db||!isOwnerV())return;
  try{NOTES.sub=db.collection('notes').onSnapshot(s=>{const d=s.docs||s;NOTES.list=(d||[]).map(x=>({id:x.id,...(typeof x.data==='function'?x.data():x.data)})).filter(n=>n&&typeof n.text==='string');NOTES.loaded=true;notesList()},()=>{})}catch(e){}}
// the card is drawn once (so a half-typed note survives the Processes refresh); only the list inside it is redrawn
function renderNotes(){const box=$('#notesBox');if(!box)return;box.hidden=!isOwnerV();if(box.hidden)return;
  if(!box.dataset.ready){box.dataset.ready='1';
    box.innerHTML=`<section class="psec nup" aria-labelledby="nupH"><h3 id="nupH">Next up <span class="pcount" id="nupN" hidden></span></h3>
      <form class="nupadd" id="nupForm" autocomplete="off"><label class="sr" for="nupIn">New note</label><input id="nupIn" type="text" maxlength="500" placeholder="What to flesh out next…"><button type="submit" class="act">Add</button></form>
      <div id="nupList"></div></section>`}
  notesSubscribe();notesList()}
function noteRow(n,i,len){const del=NOTES.del===n.id;
  return `<li class="nrow" data-note="${esc(n.id)}" draggable="${del?'false':'true'}"><span class="ngrip" aria-hidden="true" title="Drag to reorder">⋮⋮</span>
    <input type="checkbox" class="ntick" data-ntick="${esc(n.id)}" aria-label="Done: ${esc(n.text)}">
    <span class="ntext">${esc(n.text)}</span>
    <span class="nacts">${del?`<span class="ndelq">Delete? <button type="button" class="nyes" data-ndelok="${esc(n.id)}">Delete</button><button type="button" class="nno" data-ndelno="1">Keep</button></span>`:
      `<button type="button" class="nbtn" data-nmove="-1" data-nid="${esc(n.id)}" aria-label="Move up"${i===0?' disabled':''}>↑</button><button type="button" class="nbtn" data-nmove="1" data-nid="${esc(n.id)}" aria-label="Move down"${i===len-1?' disabled':''}>↓</button><button type="button" class="nbtn ndel" data-ndel="${esc(n.id)}" aria-label="Delete note">×</button>`}</span></li>`}
function notesList(){const el=$('#nupList');if(!el)return;const op=notesOpen(),dn=notesDone(),wasOpen=!!el.querySelector('details.ndone[open]');
  const n=$('#nupN');if(n){n.hidden=!op.length;n.textContent=op.length}
  el.innerHTML=(op.length?`<ol class="nlist">${op.map((x,i)=>noteRow(x,i,op.length)).join('')}</ol>`:`<p class="pempty">${NOTES.loaded||!db?'Ideas for what to build next. Claude reads this list.':'Loading notes…'}</p>`)+
    (dn.length?`<details class="ndone"${wasOpen?' open':''}><summary>Done <span class="pcount">${dn.length}</span></summary><ul class="nlist">${dn.map(x=>`<li class="nrow isdone" data-note="${esc(x.id)}"><input type="checkbox" class="ntick" data-ntick="${esc(x.id)}" checked aria-label="Not done: ${esc(x.text)}"><span class="ntext">${esc(x.text)}</span><span class="nacts">${NOTES.del===x.id?`<span class="ndelq">Delete? <button type="button" class="nyes" data-ndelok="${esc(x.id)}">Delete</button><button type="button" class="nno" data-ndelno="1">Keep</button></span>`:`<button type="button" class="nbtn ndel" data-ndel="${esc(x.id)}" aria-label="Delete note">×</button>`}</span></li>`).join('')}</ul></details>`:'')}
async function noteSet(n,patch){if(!isOwnerV()||!db)return false;const {id,...rest}=n;
  try{await db.doc('notes/'+id).set({...rest,...patch});return true}catch(e){toast('Could not save. Try again in a moment.');return false}}
/* Shared by the Processes lists that the owner orders by hand: Next up (here) and Import order (32_papers_q.js).
   Code health 13 Nov, rule 3 "Reshape, don't bolt on": one copy of the order writer and of drag-to-reorder. */
// give the items in `ids` the order 1..n, repaint, then save only the ones that moved
async function writeOrder(items,ids,save,redraw){const by=Object.fromEntries(items.map(x=>[x.id,x]));
  const ch=ids.map((id,i)=>[by[id],i+1]).filter(([x,o])=>x&&+x.order!==o);ch.forEach(([x,o])=>x.order=o);redraw();
  for(const [x,o] of ch)await save(x,{order:o})}
// drag to reorder (desktop); ↑ ↓ buttons do the same from the keyboard or a phone. rows = selector of the list's <li> (each
// carries its id in data-<key>); ids() = the current order; reorder(ids) saves a new order; redraw() repaints after a cancelled drag
function sortableList(rows,key,ids,reorder,redraw){let drag=null;const R=rows+'[draggable]';
  document.addEventListener('dragstart',e=>{const li=e.target.closest&&e.target.closest(rows+'[draggable="true"]');if(!li)return;drag=li.dataset[key];li.classList.add('ndrag');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag)}catch(_){}});
  document.addEventListener('dragover',e=>{if(!drag)return;const li=e.target.closest&&e.target.closest(R);if(!li||li.dataset[key]===drag)return;e.preventDefault();
    const r=li.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;$$(rows+'.nover-a,'+rows+'.nover-b').forEach(x=>x.classList.remove('nover-a','nover-b'));li.classList.add(after?'nover-a':'nover-b')});
  document.addEventListener('drop',async e=>{if(!drag)return;const li=e.target.closest&&e.target.closest(R);e.preventDefault();const from=drag;drag=null;
    if(!li||li.dataset[key]===from){redraw();return}const after=li.classList.contains('nover-a'),L=ids().filter(x=>x!==from);
    const k=L.indexOf(li.dataset[key]);if(k<0){redraw();return}L.splice(after?k+1:k,0,from);await reorder(L)});
  document.addEventListener('dragend',()=>{if(drag){drag=null;redraw()}})}
async function notesReorder(ids){if(!isOwnerV())return;await writeOrder(NOTES.list,ids,noteSet,notesList)}
document.addEventListener('submit',async e=>{if(e.target.id!=='nupForm')return;e.preventDefault();if(!isOwnerV()||!db)return;
  const inp=$('#nupIn'),t=inp.value.trim();if(!t)return;const op=notesOpen();
  const id='n'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);
  const doc={text:t.slice(0,500),order:(op.length?Math.max(...op.map(n=>+n.order||0)):0)+1,done:false,by:me||null,at:new Date().toISOString()};
  try{await db.doc('notes/'+id).set(doc);inp.value='';inp.focus()}catch(_){toast('Could not save. Try again in a moment.')}});
document.addEventListener('click',async e=>{const t=e.target;if(!t.closest||!t.closest('#notesBox'))return;
  const mv=t.closest('[data-nmove]');if(mv){const ids=notesOpen().map(n=>n.id),i=ids.indexOf(mv.dataset.nid),j=i+ +mv.dataset.nmove;if(i<0||j<0||j>=ids.length)return;
    [ids[i],ids[j]]=[ids[j],ids[i]];await notesReorder(ids);const b=document.querySelector(`#nupList [data-nid="${CSS.escape(mv.dataset.nid)}"][data-nmove="${mv.dataset.nmove}"]`);if(b&&!b.disabled)b.focus();return}
  const dl=t.closest('[data-ndel]');if(dl){NOTES.del=dl.dataset.ndel;notesList();const k=$('#nupList [data-ndelno]');if(k)k.focus();return}
  if(t.closest('[data-ndelno]')){const id=NOTES.del;NOTES.del=null;notesList();const b=id&&document.querySelector(`#nupList [data-ndel="${CSS.escape(id)}"]`);if(b)b.focus();return}
  const ok=t.closest('[data-ndelok]');if(ok){if(!isOwnerV()||!db)return;const id=ok.dataset.ndelok;NOTES.del=null;
    try{await db.doc('notes/'+id).delete();NOTES.list=NOTES.list.filter(n=>n.id!==id);notesList();toast('Note deleted')}catch(_){toast('Could not delete. Try again in a moment.')}return}});
document.addEventListener('change',async e=>{const c=e.target.closest&&e.target.closest('#notesBox [data-ntick]');if(!c)return;
  const n=NOTES.list.find(x=>x.id===c.dataset.ntick);if(!n)return;if(!isOwnerV()){c.checked=!!n.done;return}
  const done=c.checked,patch={done,doneAt:done?new Date().toISOString():null};
  if(!done)patch.order=(Math.max(0,...notesOpen().map(x=>+x.order||0)))+1;   // un-ticked: back to the end of the list
  Object.assign(n,patch);notesList();await noteSet(n,patch)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&NOTES.del&&e.target.closest&&e.target.closest('#notesBox')){NOTES.del=null;notesList()}});
sortableList('#nupList .nlist>li','note',()=>notesOpen().map(n=>n.id),notesReorder,notesList);
if(view==='processes')renderNotes();   // Processes may already be open when this block loads
</script>
<script>
// owner 14 Nov (mockup A of three): "I like A's design much more" — course lanes, a batch panel, one queue
// owner 14 Nov: "there seems to be some inconsistencies in paper numbers" — one status per paper, every number from one list
// owner 13 Nov: "New exams are gonna be added to this folder periodically we need a way to ... see what we actually haven't ingested yet"
/* ---------- Processes › Papers (Curate: editors only) ----------
   data/inventory.json (tools/inventory.py) gives every paper in the shared folder ONE status (st): imported, ready_current,
   ready_old, needs_check, held_y11, held_course, not_in_scope, duplicate. Every number on this tab is a count of that one list,
   in papers (files only in the top line), so the summary's four numbers add up to the folder total.
   Top to bottom: the top line (papers in the folder, last scan, new since the baseline scan, Rescan drive: PQ.scan,
   33_drive_scan.js), the summary (imported · ready to import · need a check · held or not in scope), then two panels:
   - Courses (#prLanes): one lane per course + year level with ready papers (inventory "lanes", tools/batches.py: each ready
     paper sits in a fixed numbered batch of 9, assigned once). A square per batch (imported / in the queue / ready, current
     syllabus / ready, old syllabus); a click opens the batch panel (its papers, Swap). +1 batch, +2 batches and Queue all add
     the lane's next batches that are not queued yet. Then the Needs a check lane (Run the cover-page check; Resolve opens
     #processes/papers/check, PQ.check in 35_papers_check.js), the locked courses folded into one row, and the legend.
   - Queue (#prQueue): PQ.run (34_papers_run.js).
   Review state (owner 14 Nov: "I would like to see how many of the batches have cleared checks on the import page too, its good
   to know"): an imported batch is "cleared review" when every one of its papers has finished Review's flow, else "imported,
   waiting for review". A paper's state is Review's own per-paper track (08_review.js paperWork: every step done, no open Your
   calls), which reads the reviews through RKEY, so key docs (reviews/k_<key>, p_<paper key>, Fix 2) count; nothing here
   re-implements it (CODE_HEALTH rule 3). The reviews subscription (14_start.js) redraws this tab, so it updates live.
   Swap (owner's mockup: "Swap moves the paper to the end of the course and pulls the next one in") is db collection "batches",
   one doc per lane ('advanced_12'): {course, yl, swaps: [{id, by, at}]}; swapsApply below = tools/batches.py apply_swaps.
   The proposed path-rule fixes (tools/classify_paths.py RULES_PROPOSED) and the owner's answers in Needs a check (db paperfix)
   apply here at once (model()), before Claude rebuilds the inventory: the inventory carries both outcomes (proposed).
   One page-wide name, PQ (CODE_HEALTH rule 1); PQ.scan, PQ.run and PQ.check hang off it. Only editors read or write. */
const PQ=(()=>{
const S={data:null,loading:false,failed:false,acc:null,fix:{},swaps:{},subs:{},open:null,busy:false};
const YN={'12':'Year 12','11':'Year 11','?':'Year ?'};
const READY=['ready_current','ready_old'];
const SIZE=9;
const nf=x=>Number(x||0).toLocaleString('en-AU');
const plural=(n,w,ws)=>`${nf(n)} ${n===1?w:(ws||w+'s')}`;
const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
const label=p=>p.l||(p.t==='HSC'?`${p.y} NESA HSC`:`${p.y} ${p.s} ${p.t}`);
const courses=()=>(S.data&&S.data.courses)||[];
const course=k=>courses().find(c=>c.key===k)||{key:k,name:k,ready:false};
const short=k=>course(k).short||course(k).name||k;
// a lane's name, e.g. "Year 12 Advanced" (course names come from the inventory: CODE_HEALTH rule 5)
const laneName=(c,yl)=>c==='unknown'?(yl==='?'?'Course and year not known':`${YN[yl]}, course not known`):yl==='?'?`${short(c)}, year not known`:`${YN[yl]} ${short(c)}`;
const laneKey=(c,yl)=>c+'_'+(yl==='?'?'x':yl);
const yrs=ps=>{const y=ps.map(p=>p.y).filter(Boolean);if(!y.length)return '';const a=Math.min(...y),b=Math.max(...y);return a===b?String(a):`${a}–${String(b).slice(-2)}`};
const snap=(s)=>{const d=s.docs||s;return (d||[]).map(x=>({id:x.id,...(typeof x.data==='function'?x.data():x.data)}))};

// ---- loading (editors only: a viewer never fetches the inventory or subscribes)
// rv: Review's Inbox asks for the batches (batchOf), so an editor who is not the owner (the checker) fetches it too; a viewer never does
function load(rv){if(S.data||S.loading||!(isOwnerV()||rv&&isEditor()))return;S.loading=true;
  fetch('data/inventory.json?v='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{S.data=d&&Array.isArray(d.groups)?d:null;S.failed=!S.data})
    .catch(()=>{S.failed=true}).finally(()=>{S.loading=false;if(view==='processes')render();else if(view==='inbox'&&S.data)renderInbox()})}
function subscribe(){if(!db||!isOwnerV())return;
  const on=(k,f)=>{if(S.subs[k])return;try{S.subs[k]=f()}catch(e){}};
  on('fix',()=>db.collection('paperfix').onSnapshot(s=>{S.fix={};snap(s).forEach(x=>{if(Number.isFinite(+x.id))S.fix[+x.id]=x});redraw()},()=>{}));
  on('swaps',()=>db.collection('batches').onSnapshot(s=>{S.swaps={};snap(s).forEach(x=>{S.swaps[x.id]=Array.isArray(x.swaps)?x.swaps:[]});redraw();if(API.run)API.run.draw()},()=>{}));
  on('acc',()=>db.doc('scans/rules').onSnapshot(d=>{S.acc=d&&d.exists?(typeof d.data==='function'?d.data():d.data):null;redraw()},()=>{}))}

// ---- the proposed rule fixes: accepted in the page db (scans/rules) or already in the inventory
function accepted(){const pr=S.data&&S.data.proposed;if(!pr)return false;if(pr.accepted)return true;const a=S.acc;return !!(a&&a.accepted&&a.version===pr.version)}
// the rules a new Drive file is classified with (33_drive_scan.js): the inventory's, or the proposed set once accepted here
function rules(){const D=S.data;if(!D)return null;const pr=D.proposed;return pr&&!pr.accepted&&accepted()&&pr.rules_after?pr.rules_after:D.rules}
// a paper the owner placed: the same decisions as tools/inventory.py status_of
function placedStatus(c,yl,y){const C=course(c);
  if(c!=='unknown'&&!C.ready)return 'held_course';if(yl==='11')return 'held_y11';if(c==='unknown'||yl==='?'||!y)return 'needs_check';
  const old=(S.data.rules&&S.data.rules.old_syllabus_before)||2020;return y<old?'ready_old':'ready_current'}

// ---- the one list every number comes from (memoised on the inventory, the Accept and the owner's answers)
let M=null;
function model(){const D=S.data;if(!D)return null;const k=accepted()+'|'+JSON.stringify(S.fix);if(M&&M.D===D&&M.k===k)return M;
  let ps=[];for(const g of D.groups)for(const p of g.papers)ps.push({...p,c:g.course,yl:g.yl});
  const pr=D.proposed;
  if(pr&&!pr.accepted&&accepted()){const rm=new Set(pr.replace||[]);ps=ps.filter(p=>!rm.has(p.id));
    for(const [gk,xs] of Object.entries(pr.papers||{})){const [c,yl]=gk.split('|');xs.forEach(p=>ps.push({...p,c,yl}))}}
  for(const p of ps){const f=S.fix[p.id];if(!f||p.st!=='needs_check')continue;
    if(f.out){p.st='not_in_scope';p.why='you set it aside';p.mine=1}
    else if((f.yl===11||f.yl===12)&&f.course){p.c=f.course;p.yl=String(f.yl);if(!p.y&&f.y)p.y=f.y;p.st=placedStatus(p.c,p.yl,p.y);p.mine=1}}
  const t={};(D.statuses?Object.keys(D.statuses):[]).forEach(s=>t[s]=0);ps.forEach(p=>{t[p.st]=(t[p.st]||0)+1});
  return M={D,k,ps,t,total:ps.length,byId:new Map(ps.map(p=>[p.id,p]))}}

// ---- review state (owner 14 Nov: "I would like to see how many of the batches have cleared checks on the import page too")
// 'cleared' | 'waiting' for an imported paper, from Review's own paperWork (08_review.js) on each file that has questions in the
// bank index; null until the index and the question details (job 2) have loaded. Memoised on the reviews map and the index (both replaced, never mutated).

function swapsApply(bs,sw,fixed){const B=bs.map(b=>b.slice()),sizes=B.map(b=>b.length),frozen=b=>b.some(i=>fixed.has(i));
  for(const s of sw||[]){const i=s&&typeof s==='object'?s.id:s,k=B.findIndex(b=>b.includes(i));if(k<0||frozen(B[k]))continue;
    const idx=[];for(let j=k;j<B.length;j++)if(!frozen(B[j]))idx.push(j);
    const flat=idx.flatMap(j=>B[j]).filter(x=>x!==i).concat(i);let o=0;for(const j of idx){B[j]=flat.slice(o,o+sizes[j]);o+=sizes[j]}}

   records it). New files are classified with PQ.rules(): inventory.rules = tools/classify_paths.py's active rules, or the
