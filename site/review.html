.conf{font-weight:600;border-radius:4px;padding:0 6px}.conf.c3{background:var(--bad-soft,#fde2e2);color:var(--bad,#b42318)}.conf.c2{background:var(--warn-soft);color:var(--warn)}.conf.c1{background:var(--ok-soft);color:var(--ok)}
/* owner 12 Nov: "the running now is taking up too much space ... should be a simple pill", details on hover
   owner 14 Nov: "need a pill for current jobs and queued jobs": two quiet pills, "N running" (accent) and "N queued" (muted).
   Each is a link to Processes; its list shows on hover / focus, or on the first tap on a touch screen (.open). */
.jobs{position:relative;display:inline-flex;gap:6px;align-items:center}
.jobs .jp{position:relative;display:inline-flex}
.jobs .jpill{display:inline-flex;align-items:center;gap:7px;font:500 13px var(--sans);border-radius:999px;padding:3px 11px;white-space:nowrap;text-decoration:none;cursor:pointer;font-variant-numeric:tabular-nums;transition:background-color .15s,border-color .15s}
.jobs .run .jpill{background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.jobs .que .jpill{background:transparent;color:var(--muted);border:1px solid var(--line2)}
.jobs .run .jpill:hover{border-color:var(--accent)}.jobs .que .jpill:hover{color:var(--ink);border-color:var(--muted)}
.jobs .jpill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jobs .run.hit .jpill{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}

/* ---- Exams page (owner 14 Nov: "Making the exam should be on another page, and it should operate similar to the html
   file I gave you") — his exam maker's layout in Questgen's look. Fluency = teal (accent), problem solving = amber (Y11). ---- */
:root{--exfl:var(--accent);--exfl-soft:var(--accent-soft);--exps:var(--y11);--exps-soft:var(--y11-soft)}
.exams{padding-block:14px 60px;min-width:0}

.exhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}

.exseg{border-radius:7px;border-color:var(--line2)}
.exseg button{padding:6px 15px;font:500 13.5px var(--sans);color:var(--muted);border-left:1px solid var(--line2)}
.exseg button:first-child{border-left:0}
.exseg button:hover{color:var(--ink)}
.exseg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}   /* owner 14 Nov: "clean and sophisticated" */
.exnarrow,.exnarrow-s{display:none!important}

.linkbtn{border:0;background:none;color:var(--accent);font:500 12.5px var(--sans);padding:2px 4px;cursor:pointer}

/* setup */
.exsetup{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.extopics{min-width:0}
.pagehead{margin-bottom:14px}.pagehead .eyebrow{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.pagehead h2{font:600 28px/1.15 var(--display);margin:2px 0 4px;text-wrap:balance}
.pagehead .lead{color:var(--muted);margin:0;max-width:62ch}
/* owner 14 Nov: "the side bar UI also looks a bit cartoonish. It should all feel clean and sophisticated."
   Hairlines instead of filled cards, 6-8px radii, thin sliders, quiet labels, tabular numbers. Tokens only, so it follows the theme. */
.selbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px 8px 14px;font-size:13px;color:var(--muted);position:sticky;top:calc(var(--hdr,64px) + 8px);z-index:4}
.selbar .sp{flex:1}.selbar b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.strand{margin-top:26px}.strand-h{display:flex;align-items:baseline;gap:8px;margin:0 2px 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.strand-h h3{font:600 18px var(--display);margin:0;margin-right:auto}
.extiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;align-items:start}
.extile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s;min-width:0}
.extile:hover{border-color:var(--line2)}
.extile.on,.extile.ex-part{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.extile.on{background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
.extile-h{display:flex;gap:11px;align-items:flex-start}
.extile-t{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:none;border:0;padding:0;text-align:left;border-radius:4px;cursor:pointer;color:var(--ink);font:inherit}
.extile-t:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.extile-t .tt{min-width:0}.extile-h b{display:block;font:500 14px/1.35 var(--sans);letter-spacing:-.005em}
.extile-h small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.extile-h small.expicked{color:var(--ink);opacity:.75;margin-top:4px;line-height:1.4}
.exchev{flex:none;width:20px;height:20px;display:grid;place-items:center;color:var(--muted);transition:transform .18s,color .15s;margin-top:0}
.exchev::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.exchev{font-size:0}.extile-t:hover .exchev{color:var(--ink)}.extile.open .exchev{transform:rotate(180deg)}
/* a real-looking checkbox: 16px, 4px radius */
.tbox{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line2);display:grid;place-items:center;margin-top:2px;background:var(--panel);color:var(--panel);font:700 11px/1 var(--sans);cursor:pointer;padding:0;transition:background .12s,border-color .12s}
.tbox:hover:not(:disabled){border-color:var(--accent)}
.tbox:disabled{cursor:default;opacity:.4}
.extile.on .tbox{background:var(--accent);border-color:var(--accent)}
.extile.ex-part .tbox{border-color:var(--accent)}.extile.ex-part .tbox::after{content:"";width:8px;height:1.5px;background:var(--accent);border-radius:1px}
/* subtopics inside a tile: a quiet checklist (was mint pills) */
.extile .pills{display:grid;gap:1px;margin:2px -4px 0 23px;padding-top:6px;border-top:1px solid var(--line)}
.extile .pills[hidden]{display:none}
.extile .pill{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:var(--ink);border-radius:5px;padding:5px 6px;font:13px/1.3 var(--sans);text-align:left;cursor:pointer;transition:background .12s}
.extile .pill::before{content:"";flex:none;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--line2);background:var(--panel)}
.extile .pill:not(:disabled):hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.extile .pill[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--panel)}
.extile .pill .n{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.extile .pill:disabled{color:var(--muted);cursor:not-allowed;opacity:.6}
/* settings column */
.exsettings{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 20px 18px;position:sticky;top:calc(var(--hdr,64px) + 8px);max-height:calc(100vh - var(--hdr,64px) - 20px);overflow:auto;min-width:0;scrollbar-width:thin}
.exsettings .group{padding:16px 0 4px;border-top:1px solid var(--line)}
.exsettings .group:first-child{border-top:0}
.exsettings h3{font:500 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.ctl{margin:0 0 16px}.ctl .lab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:500 13px var(--sans);color:var(--ink);margin-bottom:2px}
.ctl .val{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;font-size:12.5px}
.ctl .ends{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.ctl input[type=text]{width:100%;padding:7px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink);font:14px var(--sans);margin-top:4px}
.ctl input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ctl.fl{--c:var(--exfl)}.ctl.ps{--c:var(--exps)}
.ctl.fl .lab label::before,.ctl.ps .lab label::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--c);margin-right:7px;vertical-align:1px}
/* thin, precise range: 4px track, 14px knob with a subtle ring */
input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:4px;padding:0;border:0;min-height:0;box-shadow:none;box-sizing:border-box;border-radius:2px;margin:12px 0 8px;background:linear-gradient(to right,var(--c,var(--accent)) var(--p,50%),var(--line) var(--p,50%));cursor:pointer;outline:none}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--panel);border:1.5px solid var(--c,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--accent)) 16%,transparent),0 1px 2px rgba(0,0,0,.18);cursor:grab;transition:box-shadow .15s}
input[type=range].rng::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--panel);border:1.5px solid var(--c,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--accent)) 16%,transparent)}
input[type=range].rng:hover::-webkit-slider-thumb,input[type=range].rng:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px color-mix(in srgb,var(--c,var(--accent)) 22%,transparent),0 1px 2px rgba(0,0,0,.18)}
input[type=range].rng:active::-webkit-slider-thumb{cursor:grabbing}
input[type=range].rng:disabled{opacity:.35;cursor:default}
#gSplit{--c:var(--muted);background:var(--line)}
.splitbar{display:flex;height:4px;border-radius:2px;overflow:hidden;gap:2px;margin:-2px 0 6px}
.splitbar i{display:block;min-width:0}.splitbar .f{background:var(--exfl)}.splitbar .p{background:var(--exps)}
.splitleg{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.splitleg b{color:var(--ink);font-weight:600}.splitleg i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:0}
.splitleg i.f{background:var(--exfl)}.splitleg i.p{background:var(--exps)}
/* papers to draw from: a hairline segmented multi-select */
/* critic 14 Nov: content-sized columns so "School exams" stays on one line at 390px */
.srcseg{display:grid;grid-template-columns:repeat(3,auto);border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin-top:6px}
.srcseg button{border:0;border-left:1px solid var(--line2);background:var(--panel);color:var(--muted);font:500 12.5px/1.2 var(--sans);padding:7px 6px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;min-width:0;transition:background .12s,color .12s}
.srcseg button:first-child{border-left:0}
.srcseg button:hover{color:var(--ink)}
.srcseg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.srcseg button[aria-pressed="true"]::before{content:"";flex:none;width:7px;height:4px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-1px) rotate(-45deg)}
.srcseg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.exsettings .exck{font-size:13px;margin:10px 0 4px}
.exsettings .exck input{width:14px;height:14px;margin:0}
/* availability: small multiples with hairline cells; the target cell is outlined in the accent */
.avail{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;margin:6px 0 6px;table-layout:fixed}
.avail th{font-weight:500;color:var(--muted);text-align:center;padding:0 0 5px;font-size:11px;letter-spacing:.02em}
/* owner 14 Nov: "overlap". The label column has its own width (set by <col class="kc">) and a 12px gap before B2;
   labels wrap between words inside it and never reach the cells. */
.avail col.kc{width:7.8em}
.avail th.k{text-align:left;color:var(--ink);font-weight:500;font-size:12px;line-height:1.25;padding:0 12px 0 0;overflow-wrap:break-word;hyphens:manual}

.avail tr.ps td{background:color-mix(in srgb,var(--exps) calc(var(--a,0)*1%),var(--panel))}
.avail td.z{color:var(--muted);opacity:.7}.avail td.hot{outline:1.5px solid var(--accent);outline-offset:-1.5px;font-weight:600}
.availcap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.availcap i{display:inline-block;width:9px;height:9px;border:1.5px solid var(--accent);border-radius:1px;margin-right:6px;vertical-align:-1px}
.poolline{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5;font-variant-numeric:tabular-nums}.poolline b{color:var(--ink);font-weight:600}
.warnbox{border-left:2px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:0 6px 6px 0;padding:7px 10px;font-size:12.5px;margin:10px 0 6px;line-height:1.45}.warnbox p{margin:2px 0}
.exgo{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}

.exgen:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 1px 3px rgba(0,0,0,.18)}

.exgen:disabled{opacity:.4;cursor:not-allowed}
.exgohint{font-size:12px;color:var(--muted);flex-basis:100%}
.pickhand{margin:0;padding:0}
.result{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:10px 12px;font-size:12.5px;margin-top:14px;line-height:1.55;color:var(--ink)}.result b{font-variant-numeric:tabular-nums}
.result .xa-warn{margin:6px 0 0}
.genrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

/* pick by hand */
.expick{display:grid;grid-template-columns:250px minmax(0,1fr) 380px;gap:0;align-items:start;border-top:1px solid var(--line)}
.exside,.exright{position:sticky;top:var(--hdr,64px);max-height:calc(100vh - var(--hdr,64px));overflow:auto;padding:16px 14px;scrollbar-width:thin}
.exside{border-right:1px solid var(--line)}.exright{border-left:1px solid var(--line);background:var(--panel)}
.exmain{padding:16px 20px 60px;min-width:0}
.exsidehd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.exside h3{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.exside .tb{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:5px 8px;font:13px var(--sans);color:var(--ink);cursor:pointer}

.exside details.exfa>summary span:first-child{flex:1}.exside details.exfa>summary .c{font-weight:400;color:var(--muted);font-size:12px}

.exfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}

.exfilters select{padding:7px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink);font:13px var(--sans);max-width:100%;min-width:0}

/* preview + grading */

.gqrow{display:flex;align-items:center;cursor:grab}.gqrow:active{cursor:grabbing}

/* diagram size (owner 14 Nov: "resizing is really unintuitive, it should just be drag the corner in and out diagonally").
   The box hugs the drawn diagram so the handle sits on its corner. Screen only: a faint outline on hover, the handle on hover /
   focus (always on touch screens), and a small live % only while dragging. The sheet is always white, so these use the paper's
   fixed tokens below, not the theme's. */
.xpages{--pp-accent:#1e5f5a;--pp-ink:#16181d;--pp-paper:#fff;--pp-warn:#9a5b00}
.exfigw{position:relative;display:block;text-align:center;margin:3mm 0}
.exfigbox{position:relative;display:inline-block;vertical-align:top;max-width:100%}
.exfigw .figslot{zoom:var(--fs,1);margin:0}
.figpct,.figh{display:none}
@media screen{
  .exfigw:hover .exfigbox,.exfigw.resizing .exfigbox,.exfigw:focus-within .exfigbox{outline:1px solid color-mix(in srgb,var(--pp-accent) 28%,transparent);outline-offset:3px;border-radius:2px}
  .exfigw:hover .figh,.exfigw:focus-within .figh,.exfigw.resizing .figh{display:block}
  /* fix 13 Nov (exam pools): the corner handle sits 7 px outside the diagram, and a question's text box (.tx) clips its overflow,
     so on a diagram as wide as the column (a wide table, or one enlarged to the column) the handle was cut off and could not be
     grabbed. On the paper, a text box holding a diagram no longer clips; flow-root keeps it a block formatting context exactly as
     the clipping did, so its height and the page layout are unchanged. */
  .xpages .tx:has(.exfigw){overflow:visible;display:flow-root}
  .figh{position:absolute;right:-7px;bottom:-7px;width:10px;height:10px;box-sizing:border-box;border-radius:2px;background:var(--pp-paper);border:1.5px solid var(--pp-accent);cursor:nwse-resize;z-index:3;touch-action:none}
  .figh::before{content:"";position:absolute;inset:-14px}
  .xpages .figh,.xpages .figpct{zoom:calc(1/var(--xz,1))}
  .figh:hover,.exfigw.resizing .figh{background:var(--pp-accent)}
  .figh:focus-visible{outline:2px solid var(--pp-accent);outline-offset:2px}
  .exfigw.resizing .figpct{display:block;position:absolute;right:8px;bottom:8px;z-index:3;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--pp-ink) 82%,transparent);color:var(--pp-paper);font:500 10.5px/1.5 var(--sans);font-variant-numeric:tabular-nums;pointer-events:none}
  body.fig-resizing,body.fig-resizing *{cursor:nwse-resize!important;user-select:none!important}
  @media (hover:none){.figh{display:block;opacity:.7}}
}

.g2arr{color:var(--line2);font-size:18px;align-self:center;justify-self:center}
.g2card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:3px;align-content:start;min-width:0}
.g2card b{font:600 15px var(--sans)}.g2card>span{font-size:13px;color:var(--muted)}
/* topic hierarchy */
.g2tree{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
.g2node{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px;display:grid;gap:2px;min-width:0}
.g2node b{font:600 26px/1 var(--display);font-variant-numeric:tabular-nums}.g2node span{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.g2node em{font-style:normal;font-size:12.5px;color:var(--accent);overflow-wrap:anywhere}
.g2three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
/* filing diagram */
.g2file{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1.2fr) auto minmax(0,.8fr);gap:10px;align-items:center}
.g2q,.g2tally,.g2win{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 12px;display:grid;gap:6px;min-width:0}
.g2p{display:grid;grid-template-columns:2em 1fr auto;gap:6px;font-size:13px;align-items:baseline}.g2p span{font-weight:600}.g2p em{font-style:normal;color:var(--muted)}.g2p b{font-variant-numeric:tabular-nums}
.g2tl{display:grid;grid-template-columns:minmax(0,1fr) 54px 1.2em;gap:8px;align-items:center;font-size:12.5px}
.g2tl i{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.g2tl s{display:block;height:100%;background:var(--muted)}
.g2tl.win{font-weight:600}.g2tl.win s{background:var(--accent)}
.g2tie{font-size:12px;color:var(--accent);font-weight:600}
.g2win{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}.g2win b{font:600 15px var(--display)}.g2win span{font-size:12.5px;color:var(--muted)}
.g2rules{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted)}.g2rules b{color:var(--ink);font-weight:600}
/* bars */
.g2cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
.g2yr{margin:4px 0 6px;color:var(--ink)}
.g2bars{display:grid;gap:5px}
.g2bar{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) 3em 3em;gap:8px;align-items:center;font-size:12.5px}
.g2bar .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g2bar i{height:8px;background:color-mix(in srgb,var(--line) 60%,transparent);border-radius:2px;overflow:hidden}.g2bar s{display:block;height:100%;background:var(--y12)}
.g2bars.y11 s{background:var(--y11)}.g2bars.band s{background:var(--accent)}
.g2bar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.g2bar em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.g2bars:not(.band) .g2bar{grid-template-columns:minmax(0,13em) minmax(0,1fr) 3em}
/* difficulty */
.g2scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.g2b{padding:12px;display:grid;gap:2px;background:var(--panel);border-left:1px solid var(--line);position:relative}.g2b:first-child{border-left:0}
.g2b::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
.g2b.b2::before{opacity:.25}.g2b.b3::before{opacity:.45}.g2b.b4::before{opacity:.65}.g2b.b5::before{opacity:.85}
.g2b b{font:600 24px/1 var(--display)}.g2b span{font:600 13px var(--sans)}.g2b em{font-style:normal;font-size:12.5px;color:var(--muted);line-height:1.4}
.g2anchor{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
.g2an{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px;display:grid;gap:2px;align-content:start}
.g2an b{font:600 24px/1 var(--display);font-variant-numeric:tabular-nums}.g2an span{font:600 13px var(--sans)}.g2an em{font-style:normal;font-size:12.5px;color:var(--muted)}
.g2an.hl{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.g2an b small{font:500 13px var(--sans);color:var(--muted)}
.g2calc{display:grid;gap:4px;font-size:13.5px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 14px}
.g2calc div{display:grid;grid-template-columns:2.2em 6em 1fr;gap:8px;align-items:baseline}.g2calc em{font-style:normal;color:var(--muted)}
.g2calc .eq{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}.g2calc .eq b{color:var(--accent)}
/* fluency / PS */
.g2vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g2vs>div{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 14px;display:grid;gap:3px;align-content:start}
.g2vs b{font:600 16px var(--display)}.g2vs>div>span{font-size:13px;color:var(--muted)}
.g2vs ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;display:grid;gap:2px}
.g2vs .uf{box-shadow:inset 3px 0 0 var(--y12)}.g2vs .pr{box-shadow:inset 3px 0 0 var(--y11)}
.g2split{display:flex;height:30px;border-radius:6px;overflow:hidden;font:600 12.5px var(--sans)}
.g2split span{display:flex;align-items:center;padding:0 12px;white-space:nowrap;min-width:0;overflow:hidden}
.g2split .uf{background:var(--y12-soft);color:var(--y12)}.g2split .pr{background:var(--y11-soft);color:var(--y11)}
/* examples */
.g2ex{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.g2ex>summary{cursor:pointer;padding:10px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:14px}
.g2ex>summary .muted{font-size:12.5px}
.g2ex[open]>summary{border-bottom:1px solid var(--line)}
.g2ex>*:not(summary){margin-inline:14px}.g2ex>details.help{margin-bottom:12px}
.g2qbox{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);display:grid;gap:6px;min-width:0;overflow-x:auto}
.g2how{margin-top:14px}
.g2note{font-size:13.5px;margin-block:4px 8px}
.g2home{font-size:13px;margin-block:8px}
.g2scroll{overflow-x:auto}
.g2t{width:100%;border-collapse:collapse;font-size:13px}
.g2t th{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2)}
.g2t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.g2t .tid{font:500 12px var(--mono);color:var(--accent)}
/* system */
.g2flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.g2st{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:7px 10px;display:grid;gap:1px;min-width:0}
.g2st b{font:600 13px var(--sans)}.g2st span{font-size:11.5px;color:var(--muted)}
.g2st.hl{border-color:var(--accent);background:var(--accent-soft)}
.g2flow .g2arr{font-size:14px}
.g2stores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.g2mini{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.g2mini td{padding:3px 0;border-top:1px solid var(--line)}.g2mini td:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.g2lim{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.g2lim div{background:var(--panel);padding:10px 12px;display:grid;gap:2px}.g2lim b{font:600 13px var(--sans)}.g2lim span{font-size:12.5px;color:var(--muted)}
.g2block{display:grid;gap:2px;border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 14px}.g2block b{color:var(--bad);font:600 13px var(--sans)}.g2block span{font-size:13.5px}
.g2arch{display:grid;gap:6px;justify-items:center;border:1px solid var(--line);border-radius:10px;padding:16px;background:color-mix(in srgb,var(--panel) 60%,transparent)}
.g2lane{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.g2box{border:1px solid var(--line2);border-radius:8px;background:var(--panel);padding:9px 14px;display:grid;gap:1px;text-align:center;min-width:min(220px,100%);flex:0 1 260px}
.g2box b{font:600 14px var(--sans)}.g2box span{font-size:12px;color:var(--muted)}
.g2box.user{border-style:dashed}.g2box.db{box-shadow:inset 0 3px 0 var(--accent)}.g2box.job{box-shadow:inset 0 3px 0 var(--y11)}
.g2arr.down,.g2arr.up{font-size:16px;line-height:1}
.g2map .g2to{color:var(--muted);width:1.5em;text-align:center}
.g2steps{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:1px solid var(--line2);margin-left:12px}
.g2steps li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:0 0 14px;position:relative}
.g2steps .n{width:24px;height:24px;margin-left:-12.5px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);display:grid;place-items:center;font:600 12px var(--sans)}
.g2steps li>div{display:block;padding-top:2px}.g2steps li>div>span{display:block;margin-top:2px}.g2steps b{font:600 14px var(--sans)}.g2steps span{font-size:13px;color:var(--muted)}
.g2steps .k{font-style:normal;font:600 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-left:8px}.g2steps .k.bad{color:var(--bad)}
.g2more{border-top:1px solid var(--line);padding-top:8px;font-size:14px}.g2more>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px}
@media (max-width:860px){
  .g2tree,.g2anchor{grid-template-columns:1fr 1fr}.g2tree .g2arr,.g2anchor .g2arr{display:none}
  .g2file{grid-template-columns:1fr}.g2file .g2arr{transform:rotate(90deg)}
  .g2stores{grid-template-columns:1fr 1fr}.g2lim{grid-template-columns:1fr 1fr}.g2cols,.g2vs{grid-template-columns:1fr}
  .g2scale{grid-template-columns:1fr}.g2b{border-left:0;border-top:1px solid var(--line);grid-template-columns:2.2em 7em 1fr;align-items:baseline}.g2b:first-child{border-top:0}.g2b::before{top:0;bottom:0;right:auto;width:3px;height:auto}
}
@media (max-width:520px){.g2three,.g2axes,.g2stores,.g2lim{grid-template-columns:1fr}.g2top h2{font-size:26px}.g2bar{grid-template-columns:minmax(0,9em) minmax(0,1fr) 2.6em 2.8em}.g2bars:not(.band) .g2bar{grid-template-columns:minmax(0,9em) minmax(0,1fr) 2.6em}.g2b{grid-template-columns:2em 1fr}.g2b em{grid-column:1/-1}}

/* ---- Question reports (owner 14 Nov, alpha: "see each question's dot point somewhere in the exam paper page and an ability to
   report this question for wrong difficulty, wrong dot point and have it come up in a new review tab") ---- */
/* on the paper (screen only: .scr-only is removed from the download and hidden in print) */
.xsrc.exsrc{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:baseline;gap:1mm 1mm;text-align:left}
.exsrcl{margin-left:auto;text-align:right;white-space:nowrap}
/* the ⓘ at the end of the source line (owner 14 Nov: "The dot point home looks stupid in a question" / "the i is fine").
   It sits on the always-white sheet, so it uses the paper's fixed tokens (--pp-*, 12_exams.css). */
/* negative top/bottom margins: the 20px target adds no height to the 8pt source line, so pagination is as before */
.exinfo{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;margin:-6px -3px -6px 3px;padding:0;border:0;border-radius:50%;background:none;color:color-mix(in srgb,var(--pp-ink,#16181d) 42%,transparent);cursor:pointer;position:relative;align-self:center}
.exinfo::before{content:"";position:absolute;inset:-8px}
.xpages .exinfo{zoom:calc(1/var(--xz,1))}   /* a phone-sized paper (zoom .4-.5) would shrink it to ~9px */
.exinfo:hover,.exinfo[aria-expanded="true"]{color:var(--pp-accent,#1e5f5a);background:color-mix(in srgb,var(--pp-accent,#1e5f5a) 9%,transparent)}
.exinfo:focus-visible{outline:2px solid var(--pp-accent,#1e5f5a);outline-offset:1px}
.exinfo.has::after{content:"";position:absolute;top:1px;right:1px;width:5px;height:5px;border-radius:50%;background:var(--pp-warn,#9a5b00);box-shadow:0 0 0 1.5px var(--pp-paper,#fff)}
/* the card: page UI, so theme tokens */
.qipop{position:fixed;z-index:95;box-sizing:border-box;width:min(340px,calc(100vw - 24px));max-height:min(420px,calc(100vh - 24px));overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.08);padding:12px 14px;font:13px/1.45 var(--sans);text-align:left}
.qipop:focus{outline:none}.qipop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qihd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}.qihd b{font-weight:600;color:var(--ink)}
.qiparts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.qiparts li{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.qiparts.multi li{grid-template-columns:2.6em minmax(0,1fr)}
.qiparts.multi li+li{padding-top:8px;border-top:1px solid var(--line)}
.qilab{color:var(--muted);font-variant-numeric:tabular-nums}
.qidot b{font-weight:600;font-variant-numeric:tabular-nums;margin-right:2px}.qinone{color:var(--muted)}
.qimeta{color:var(--muted);font-size:12px;margin-top:2px}
.qifoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.qirepn{font-size:12px;color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.qipop{animation:qiIn .12s ease-out}@keyframes qiIn{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}}
/* the grading panel's question detail: dot points (owner 14 Nov) */
.gdots{margin:8px 0 10px;font-size:12px}.gdots>b{display:block;font-weight:600;margin-bottom:3px}
.gdotl{list-style:none;margin:0;padding:0;display:grid;gap:3px}.gdotl li{display:flex;gap:6px;min-width:0}.gdotl .pp{flex:none;color:var(--muted)}
.gdotl-d b{font-weight:600}.gdotl-none{margin:0;color:var(--muted)}
@media print{.scr-only{display:none!important}}
/* the form */
.repscrim{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,#000 38%,transparent);display:grid;place-items:center;padding:16px;overflow:auto}
.repscrim[hidden]{display:none}
body.rep-on{overflow:hidden}
.repdlg{box-sizing:border-box;width:min(480px,100%);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:18px 20px 16px;font:14px/1.45 var(--sans);display:grid;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.rephd{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.repeyebrow{font:500 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.repdlg h3{margin:2px 0 0;font:600 18px/1.25 var(--display)}
.repsrc{font-size:12px;color:var(--muted)}
.repx{flex:none;width:30px;height:30px;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.repx:hover{border-color:var(--line);color:var(--ink)}
.repnow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.repnow>span{color:var(--muted)}.repnow .exdot b,.rep-dots .exdot b{font-weight:600}
.repf{display:grid;gap:6px;margin:0}
.repf>span{font:500 12.5px var(--sans);color:var(--ink)}.repf>span i{font-style:normal;color:var(--muted);font-weight:400;margin-left:4px}
.repf select,.repf input,.repf textarea{width:100%;min-width:0;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink);font:14px var(--sans)}
.repf textarea{resize:vertical;min-height:72px;line-height:1.45}
.repf select:focus,.repf input:focus,.repf textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.repseg,.repbands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.repbands{grid-template-columns:repeat(5,minmax(0,1fr))}
.repseg button,.repbands button{min-height:38px;border:0;border-left:1px solid var(--line2);background:var(--panel);color:var(--ink);font:500 13px var(--sans);cursor:pointer;padding:6px 4px;font-variant-numeric:tabular-nums}
.repseg button:first-child,.repbands button:first-child{border-left:0}
.repseg button:hover,.repbands button:hover{background:var(--bg)}
.repseg button[aria-checked="true"],.repbands button[aria-checked="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.repseg button:focus-visible,.repbands button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* owner 14 Nov: "Should let you pick UF and PS in the wrong diff": band and kind side by side, wrapping on a phone */
.repdif{display:flex;flex-wrap:wrap;gap:14px 12px}.repdif[hidden]{display:none}
.repf-band{flex:1 1 190px;min-width:0}.repf-wm{flex:1 0 auto;min-width:0}
.repwm{grid-template-columns:repeat(2,auto)}.repwm button{white-space:nowrap;padding-inline:12px}
@media (max-width:440px){.repf-wm{flex-basis:100%}.repwm{grid-template-columns:repeat(2,minmax(0,1fr))}}
.repmsg{font-size:12.5px;color:var(--bad)}
.repacts{display:flex;justify-content:flex-end;gap:8px;padding-top:2px}
/* the Reports tab */
.reports{padding-block:16px 60px;max-width:900px;margin-inline:auto}
.rep-top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.rep-eyebrow{font:500 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rep-top h2{margin:2px 0 4px;font:600 26px/1.2 var(--display)}
.rep-lead{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.rep-seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;max-width:100%}
.rep-seg button{border:0;border-left:1px solid var(--line2);background:var(--panel);color:var(--muted);font:500 13px var(--sans);padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.rep-seg button:first-child{border-left:0}
.rep-seg button span{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.8}
.rep-seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rep-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.rep-row{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.rep-row[data-st="resolved"],.rep-row[data-st="dismissed"]{background:transparent}
.rep-hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px}
.rep-why{font-weight:600;color:var(--ink);padding-left:10px;position:relative}
.rep-why::before{content:"";position:absolute;left:0;top:.42em;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.rep-why.rep-difficulty::before{background:var(--warn)}.rep-why.rep-dot_point::before{background:var(--accent)}
.rep-qid{font-variant-numeric:tabular-nums;color:var(--ink)}
.rep-part{color:var(--muted)}
.rep-meta{margin-left:auto;color:var(--muted);font-size:12px}
.rep-what{font-size:13px;color:var(--ink)}.rep-what b{font-weight:600}
.rep-note{margin:0;padding:2px 0 2px 12px;border-left:2px solid var(--line2);color:var(--ink);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.rep-done{font-size:12.5px;color:var(--muted)}.rep-done span{color:var(--ink)}
.rep-row[data-st="resolved"] .rep-done{color:var(--ok)}
.rep-qbox{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.rep-qbox>summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style-position:inside}
.rep-dots{font-size:12px;color:var(--muted);margin:8px 0 4px}
.rep-q{min-width:0;overflow-x:auto;padding-top:4px}
.rep-gone{font-size:13px;color:var(--warn)}
.rep-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.rep-acts input{flex:1 1 220px;min-width:0;min-height:36px;padding:6px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);color:var(--ink);font:14px var(--sans)}
.rep-acts input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rep-empty{border:1px dashed var(--line2);border-radius:8px;padding:32px 16px;text-align:center;color:var(--muted)}
@media (max-width:640px){.rep-top h2{font-size:22px}.rep-seg{width:100%}.rep-seg button{flex:1;padding:7px 6px;justify-content:center}.rep-meta{margin-left:0;flex-basis:100%}.rep-row{padding:12px}
  .repscrim{place-items:end center;padding:0}.repdlg{width:100%;border-radius:12px 12px 0 0;max-height:92vh;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
/* ==== theme2: site-wide refinement pass (owner 14 Nov: "Questgen is buns, make it more sophisticated" ... "It should all feel clean and sophisticated")
   Inserted as the LAST css in the first style block, so it overrides earlier rules. Scope: tokens, header, buttons/inputs,
   Bank, Review, Papers, Difficulty, Guide, phone menu. It does NOT style the Exams page internals (exams.* / mine.* /
   exam_auto.*) or the A4 paper (.sheet / .x*), which another pass owns; those only inherit the tokens and the button system.
   Kept from UI_SPEC: warm editorial identity, sliding tab pill, topic list behaviour, no pills on bank cards, logo. ==== */

/* ---- tokens: calmer paper ground, crisper ink, one confident accent, hairline borders ---- */
:root{
  --bg:#f6f4ef; --panel:#fffefb; --ink:#16181d; --muted:#5d5a54; --line:#e9e5dd; --line2:#d8d2c7;
  --accent:#1a5a53; --accent-soft:#e4eeeb; --ok:#26703c; --ok-soft:#e4f0e6; --warn:#8a5200; --warn-soft:#f8eedb;
  --bad:#a8251d; --bad-soft:#f9e5e3; --gen:#5f3a94; --gen-soft:#eee8f6; --hi:#f4ebd2;
  --y12:#1a5a53; --y12-soft:#e4eeeb; --y11:#9c5617; --y11-soft:#f6eadb;
  --t2-hover:color-mix(in srgb,var(--ink) 4%,transparent);
  --t2-press:color-mix(in srgb,var(--ink) 7%,transparent);
  --t2-ring:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);
  --t2-shadow:0 1px 2px rgba(22,24,29,.04),0 4px 14px -8px rgba(22,24,29,.10);
  --t2-pop:0 1px 2px rgba(22,24,29,.06),0 16px 40px -16px rgba(22,24,29,.28);
  --t2-r:6px; --t2-rl:8px;
}
/* dark: deep and neutral (no purple cast), not muddy */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --panel:#18181b; --ink:#ecebe7; --muted:#9c9991; --line:#27272b; --line2:#36363b;
  --accent:#7fc3b9; --accent-soft:#16292a; --ok:#7dcb93; --ok-soft:#15281c; --warn:#e8b25e; --warn-soft:#2e2412;
  --bad:#f08a80; --bad-soft:#331a18; --gen:#bea0ea; --gen-soft:#251d33; --hi:#322e19;
  --y12:#7fc3b9; --y12-soft:#16292a; --y11:#e4a463; --y11-soft:#2f2316;
  --t2-hover:color-mix(in srgb,var(--ink) 5%,transparent);
  --t2-press:color-mix(in srgb,var(--ink) 9%,transparent);
  --t2-shadow:0 1px 2px rgba(0,0,0,.3);
  --t2-pop:0 1px 2px rgba(0,0,0,.4),0 18px 44px -16px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{
  --bg:#111113; --panel:#18181b; --ink:#ecebe7; --muted:#9c9991; --line:#27272b; --line2:#36363b;
  --accent:#7fc3b9; --accent-soft:#16292a; --ok:#7dcb93; --ok-soft:#15281c; --warn:#e8b25e; --warn-soft:#2e2412;
  --bad:#f08a80; --bad-soft:#331a18; --gen:#bea0ea; --gen-soft:#251d33; --hi:#322e19;
  --y12:#7fc3b9; --y12-soft:#16292a; --y11:#e4a463; --y11-soft:#2f2316;
  --t2-hover:color-mix(in srgb,var(--ink) 5%,transparent);
  --t2-press:color-mix(in srgb,var(--ink) 9%,transparent);
  --t2-shadow:0 1px 2px rgba(0,0,0,.3);
  --t2-pop:0 1px 2px rgba(0,0,0,.4),0 18px 44px -16px rgba(0,0,0,.7)}

/* ---- type: Inter 14px UI, Fraunces only for page titles ---- */
body{margin:0;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.hero h1,.listhead h2,.lvtitle h2,.papers h2,.imp h2{font-family:var(--display);font-weight:500;letter-spacing:-.022em;font-variation-settings:"opsz" 72}
.hero h1{font-size:32px;line-height:1.12}
.listhead h2{font-size:26px;line-height:1.18}
.lvtitle h2,.papers h2,.imp h2{font-size:24px;line-height:1.2}
/* section and card titles move to Inter (they were Fraunces) */
.yhead h2{font:600 15px/1.3 var(--sans);letter-spacing:-.005em}
.facard .fah b,.subcard b{font:600 14.5px/1.35 var(--sans);letter-spacing:-.006em}
.card .qn{font:600 13.5px var(--sans);letter-spacing:0;font-variant-numeric:tabular-nums}
.lvcard h3{font:600 15px var(--sans);letter-spacing:-.005em}

/* labels: small caps-style eyebrows with air */
.nav h3,.pane>h2,.section>h4,table.pp th,table.rub th,.cmp figcaption,.cmp3 figcaption,.ovfig figcaption,.tchead,.tpsub,.why b{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* numbers line up */
.views .n,.brand small,.hero .stat b,.facard .fah .n,.subrow .c,.fa>button .c,.fa li .c,.sib .c,.bfilters .c,.bfilters .shown,.card .mk,.pmarks,.step .n,.pos,table.pp td,.tile b,.lvprog b,.lvpos,.msheet .n{font-variant-numeric:tabular-nums}

/* ---- header: slimmer bar, quiet segmented tabs ---- */
header{background:color-mix(in srgb,var(--panel) 92%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
body::before{background:var(--panel)}
.top{gap:8px 16px;padding-block:7px;min-height:38px}
.brand{gap:10px}
.brand .logo{height:23px}   /* owner 13 Nov logo A: lighter wordmark reads smaller, so 21 -> 23px */
.brand small{font:500 12px var(--sans);color:var(--muted);margin-left:0;letter-spacing:.01em}
/* owner 12 Nov: the pill still slides; it is now a quiet tint instead of a raised chip in a box */
.views{gap:2px;background:none;border:0;border-radius:0;padding:0}
.views a{font:500 13.5px var(--sans);letter-spacing:-.003em;color:var(--muted);padding:6px 11px;border-radius:var(--t2-r);transition:color .18s}
.views a:hover{color:var(--ink)}
.views a[aria-current="page"]{color:var(--ink);font-weight:600}
.views .slider{top:0;bottom:0;border-radius:var(--t2-r);background:var(--t2-press);box-shadow:none}
.views .n{font:500 11.5px var(--sans);color:var(--warn);margin-left:5px}
.search{max-width:300px}
.search input{height:32px;padding:0 10px;background:var(--bg);border-color:var(--line)}
.search input:hover{border-color:var(--line2)}
.themebtn{font:500 12.5px var(--sans)!important;color:var(--muted)!important;padding:0 8px!important}
.themebtn:hover{color:var(--ink)!important;background:var(--t2-hover)!important}
/* Exam button: a plain secondary button with a quiet count, not a pill */

.rbar{border-top:1px solid var(--line);padding-block:8px;gap:8px 10px}
.progress{height:2px}

/* ---- one button and input system: primary / secondary / ghost, 32px desktop ---- */
/* no display change here: some pages set .act to block/grid, and a <button> centres its label vertically on its own */
button.act,a.act{min-height:32px;padding:5px 12px;line-height:20px;border-radius:var(--t2-r);
  font:500 13px var(--sans);letter-spacing:-.003em;border:1px solid var(--line2);background:var(--panel);color:var(--ink);
  box-shadow:0 1px 1px rgba(0,0,0,.03);transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
button.act:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line2));background:color-mix(in srgb,var(--ink) 3%,var(--panel))}
button.act:active{background:var(--t2-press)}
button.act:disabled{opacity:.45;cursor:default}
a.act{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
button.act.primary,button.act.addx[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.act.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
button.act.ok:hover{border-color:var(--ok)}
button.act.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn)}
button.act.warn:hover{border-color:var(--warn)}
button.ghost,a.ghost,button.act.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--accent);padding:0 8px}
button.ghost:hover,a.ghost:hover,button.act.ghost:hover{background:var(--t2-hover);border-color:transparent}
button.act.addx{border-color:color-mix(in srgb,var(--accent) 45%,var(--line2));color:var(--accent);background:transparent}
button.act.addx:hover{border-color:var(--accent);background:var(--accent-soft)}
select,input,textarea{border-radius:var(--t2-r);border-color:var(--line2);transition:border-color .15s,box-shadow .15s}
select:not([multiple]),input:not([type=checkbox]):not([type=radio]):not([type=range]){min-height:32px}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:var(--t2-ring)}
:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px}
kbd{font:500 10.5px var(--sans);border:1px solid var(--line2);border-bottom-width:1px;border-radius:4px;padding:1px 5px;background:var(--bg);color:var(--muted)}
.badge{font:600 10.5px var(--sans);letter-spacing:.06em;border-radius:4px;padding:2px 6px}
.toast{border-radius:var(--t2-rl);font:500 13px var(--sans);padding:9px 14px;box-shadow:var(--t2-pop)}

/* ---- Bank: home ---- */
.bank{gap:36px;padding-block:28px}
.hero{gap:8px;margin:2px 0 26px}
.hero p{font-size:14.5px;line-height:1.6;max-width:64ch}
/* the stat chips become a quiet inline line of figures */
.hero .stats{gap:6px 18px;margin-top:10px;align-items:center}
.hero .stat{background:none;border:0;border-radius:0;padding:0;font-size:13px}
.hero .stat b{font-weight:600}
.bankall{border:1px solid var(--line2);border-style:solid;border-radius:var(--t2-r);padding:3px 10px;font:500 12.5px var(--sans);transition:border-color .15s,background-color .15s}
.bankall:hover{background:var(--t2-hover)}
.bankall[aria-pressed="true"]{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.yhead{gap:10px;margin:34px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.yhead span.muted{font-size:12.5px}
.yb{font:600 10px var(--sans);letter-spacing:.04em;border-radius:3px;padding:1px 5px}
.facards{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));column-gap:14px}   /* 3 columns at desktop width; row gap stays 14px because packCards() adds 14 */
.facard{border-radius:var(--t2-rl);padding:18px 20px 14px;gap:12px;border-color:var(--line);box-shadow:none}
.facard::before{width:2px}
.facard:hover{border-color:var(--line2);box-shadow:var(--t2-shadow)}
.facard .fah .n{font:600 20px/1.1 var(--sans);letter-spacing:-.02em;color:var(--ink)}
.facard .fah .n small{font:500 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.subrows{gap:0}
.subrow{grid-template-columns:minmax(0,1fr) 56px 30px;gap:12px;padding:5px 8px;margin:0 -8px;border-radius:var(--t2-r);font-size:13px;transition:background-color .12s}
.subrow:hover{background:var(--t2-hover)}
.subrow .bar{height:3px;border-radius:2px;background:var(--line)}
.subrow .bar i{border-radius:2px;opacity:.85}
.subrow .c{font-size:12.5px}
.subcard{border-radius:var(--t2-rl)}

.subcard{border-top-width:2px}
.subcard:hover{box-shadow:var(--t2-shadow)}

/* ---- Bank: sidebar topic list (owner 13 Nov motion rules untouched; only the look) ---- */
.navtools button{border-radius:var(--t2-r);font:500 12px var(--sans);padding:3px 8px}
.navtools button:hover{background:var(--t2-hover)}
.nav h3{margin:22px 0 6px 10px}
.nav h3:first-child{margin-top:0}
.fa>button{border-radius:var(--t2-r);padding:6px 10px;font-size:13.5px;font-weight:500;letter-spacing:-.003em}
.fa>button:hover,.fa li button:hover{background:var(--t2-hover)}
.fa ul{margin:0 0 6px 14px;padding-left:8px;border-left-color:var(--line)}
.fa li button{border-radius:var(--t2-r);padding:4px 8px;font-size:13px;color:color-mix(in srgb,var(--ink) 82%,var(--muted))}
.fa li button[aria-current="true"]{color:var(--accent);font-weight:600}
.navpill{border-radius:var(--t2-r);background:var(--accent-soft)}

/* ---- Bank: subtopic page ---- */
.crumbs{font-size:12.5px;gap:6px}
.crumbs button:hover{text-decoration:underline;text-underline-offset:3px}
.listhead{gap:8px 14px;margin-bottom:18px}
.dps{border-radius:var(--t2-rl);padding:10px 16px;margin-bottom:16px;font-size:13px}
.dps summary{font-size:13px}
.bfilters{border-radius:var(--t2-rl);padding:10px 14px;gap:8px 18px;margin-bottom:18px;font-size:13px}
.bfilters .grp>span,.bfilters .fl>span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
/* filter choices: a quiet segmented look instead of rounded pills */
.bfilters button{border-radius:5px;padding:3px 9px;font:500 12.5px var(--sans);transition:background-color .12s,color .12s}
.bfilters button:hover{background:var(--t2-hover)}
.bfilters button[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.bfilters .fl button{border-color:var(--line)}
.bfilters .fl button[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.sib{border-radius:var(--t2-r);font-size:12.5px;padding:4px 10px;border-color:var(--line2)}
.sib[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent);font-weight:600}
.cards{gap:14px}
.card{border-radius:var(--t2-rl);padding:18px 22px 14px;box-shadow:none;transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.card .hd{gap:6px 10px;margin-bottom:12px;padding-bottom:12px}
.card .src{font-size:12.5px}
/* marks: plain figure, not a pill (owner 12 Nov: "I see pills everywhere") */
.card .mk{background:none;border-radius:0;padding:0;font:500 12.5px var(--sans);color:var(--muted)}
.cfoot{margin-top:12px;padding-top:10px;font-size:12.5px;gap:6px 10px}
.cfoot .meta{line-height:1.5}
.cfoot a.act,.cfoot button.act{font-size:12.5px}
.plabel{font:500 13px var(--mono);letter-spacing:-.01em}
.pmarks{font:500 12px var(--sans);letter-spacing:.01em}
details.solbox>summary{font:500 13px var(--sans);color:var(--accent)}
details.solbox>summary:hover{text-decoration:underline;text-underline-offset:3px}
.sol{border-left-width:2px;border-radius:0 var(--t2-r) var(--t2-r) 0;padding:10px 14px}
.chip{border-radius:5px;font-size:12px}
.pop{border-radius:var(--t2-rl);box-shadow:var(--t2-pop);border-color:var(--line)}
.callout{border-radius:var(--t2-r);border-left-width:2px}

/* ---- Review ---- */
.step{font:500 13px var(--sans);border-color:var(--line2);border-radius:var(--t2-r);padding:0 12px;min-height:32px;gap:8px;transition:background-color .15s,border-color .15s}
.step:hover{background:color-mix(in srgb,var(--ink) 3%,var(--panel))}
.step .num{width:18px;height:18px;font:600 11px var(--sans);background:var(--bg);border:1px solid var(--line)}
.step .n{font:500 11.5px var(--sans);padding:0 6px;border-radius:4px}
.step[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.step[aria-pressed="true"] .num{background:var(--panel);color:var(--ink);border-color:transparent}
.step[aria-pressed="true"] .n{color:var(--panel);background:color-mix(in srgb,var(--panel) 18%,transparent)}
.stephelp{font-size:12.5px}

.desk{gap:20px;padding-block:20px}
.pane{border-radius:var(--t2-rl)}
.pane>h2{padding:11px 16px}
.rout{padding:16px 18px 22px;gap:16px}
.section{border-radius:var(--t2-rl);padding:12px 14px;gap:12px}
.why{border-radius:var(--t2-r);border-left-width:2px;font-size:13.5px}
.why.decide{border-left-color:var(--bad)}
.notes{border-radius:var(--t2-r)}
.seg{border-radius:var(--t2-r);padding:2px;background:var(--bg)}
.segb{border-radius:4px;font:500 12.5px var(--sans)}
.segb[aria-pressed="true"]{box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.cmp figure,.cmp3 figure,.ovfig,.dq figure{border-radius:var(--t2-r)}
.figdone,.banner,.tchoice,.picker ul,.tplist{border-radius:var(--t2-rl)}
.tchoice.active{box-shadow:0 0 0 1px var(--accent)}

/* ---- Papers / Import ---- */
.papers{padding-block:24px}
.papers .sub,.imp .sub{font-size:13.5px}
table.pp{font-size:13.5px}
table.pp th,table.pp td{padding:9px 12px}
table.pp tbody tr:hover td{background:var(--t2-hover)}
.pfil input,.pfil select{border-radius:var(--t2-r);font-size:13px;min-height:32px}
.bgrp{border-radius:var(--t2-rl);margin-bottom:10px}
.bgrp>summary{padding:10px 14px;font-weight:600;font-size:13.5px}
.brow>summary:hover{background:var(--t2-hover)}
.tile{border-radius:var(--t2-rl);padding:12px 14px}
.tile b{font:600 22px var(--sans);letter-spacing:-.02em}
.imp table{border-radius:var(--t2-rl)}
.handoff{border-radius:var(--t2-rl)}
.pr-st{border-radius:4px;font-size:10.5px;letter-spacing:.03em}

/* ---- Difficulty ---- */
.levels{padding-block:22px 0}
.lvtop{gap:12px;margin-bottom:16px}
.lvbar{height:3px}
.lvctl select{border-color:var(--line2);border-radius:var(--t2-r);font:500 13.5px var(--sans)}
.lvseg{border-color:var(--line2);border-radius:var(--t2-r);padding:2px;gap:2px;background:var(--bg)}
.lvseg button{border-radius:4px;font:500 13px var(--sans);min-height:34px;color:var(--muted)}
.lvseg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.lvcard{border-radius:var(--t2-rl);padding:16px 20px 12px}
.lvtag{font-size:11px;font-weight:600;letter-spacing:.08em}
.lvq .part.lvhit{box-shadow:inset 2px 0 0 var(--accent)}
.lvact{box-shadow:0 -10px 20px -16px rgba(0,0,0,.3)}
.lvbands button,.lvwm button,.lvnav{border-color:var(--line2);border-radius:var(--t2-rl)}
.lvbands button:hover,.lvwm button:hover,.lvnav:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink) 25%,var(--line2))}
.lvbands button b{font:600 17px var(--sans)}
.lvbands button[aria-pressed="true"],.lvwm button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.lvbands button[aria-pressed="true"] span{color:color-mix(in srgb,var(--panel) 80%,transparent)}
.lvok{border-radius:var(--t2-rl);font:600 15px var(--sans);letter-spacing:-.005em;background:var(--ok);color:var(--panel)}
.lvok kbd{border-color:color-mix(in srgb,var(--panel) 45%,transparent);background:none;color:inherit}
.lvempty{border-radius:var(--t2-rl)}

/* ---- Guide ---- */

/* ---- jobs pill (owner 12 Nov: "should be a simple pill") stays a pill, just quieter ---- */
.jobs .jpill{font-size:12.5px;padding:2px 10px}   /* owner 14 Nov: now two pills, running and queued */
.jobs .jpop{border-radius:var(--t2-rl);box-shadow:var(--t2-pop);border-color:var(--line)}

/* ---- phone menu and touch targets ---- */
.msheet{border-radius:10px;border-color:var(--line);box-shadow:var(--t2-pop);padding:6px}
.msheet a,.msheet button{min-height:44px;border-radius:var(--t2-r);font:500 15px var(--sans);letter-spacing:-.005em}
.msheet a:hover,.msheet button:hover{background:var(--t2-hover)}
.msheet a[aria-current="page"]{font-weight:600}
.msheet .n{font:500 11.5px var(--sans);border-radius:4px;padding:1px 6px}
.msheet .mt{font-size:14px}
@media (max-width:640px){
  .top{padding-block:6px;gap:8px}

/* ---- critic pass (14 Nov) ---- */
/* owner 14 Nov: "It should all feel clean and sophisticated". With the body margin gone the page sat 16px from the edge on desktop;
   give it a proper 28px gutter there (phones keep 16px, per the 14 Nov phone layout). */
@media (min-width:641px){.wrap{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
/* UI_SPEC Look: "Warm editorial: serif headings". Year headings are section headings, so they stay serif (card titles are labels and stay Inter). */
.yhead h2{font:500 21px/1.2 var(--display);letter-spacing:-.018em;font-variation-settings:"opsz" 48}
/* sidebar: counts sit on the first line of a wrapped name, the same for areas and subheadings (they were centred on one, top on the other) */
.fa>button,.fa li button{align-items:baseline}
/* review bar: "Other lists" sat above the line of step buttons */
.steps{align-items:center}
/* review progress: the empty grey track stacked on the header's hairline read as a thick double rule ("No bar under the header", 12 Nov);
   only the filled part shows now */
.progress{background:transparent}

/* data model diagram (owner 14 Nov: "Show a visual of our db schema and how everything connects") */
.g2schema{border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--panel) 55%,var(--bg));padding:8px}
.schema{display:block;width:100%;min-width:900px;height:auto;font-family:var(--sans)}
.schema .sb rect{fill:var(--panel);stroke:var(--line2)}
.schema .sb .sbh{fill:var(--accent-soft);stroke:none}
.schema .sb.file .sbh{fill:var(--y11-soft)}.schema .sb.page .sbh{fill:var(--gen-soft)}
.schema .sb.file>rect:first-child,.schema .sb.page>rect:first-child{stroke-dasharray:4 3}
.schema .st{font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:.03em;white-space:nowrap;fill:var(--ink)}   /* family, spacing, nowrap were inherited from Processes' bare .st until the 13 Nov health pass */
.schema .sn{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
.schema .sr{font-size:12px;fill:var(--ink)}.schema .sr.pk{font-weight:600}.schema .sr.fk{fill:var(--accent)}
.schema .snote{font-size:11px;fill:var(--muted)}
.schema .se{fill:none;stroke:var(--muted);stroke-width:1.3;opacity:.75}
.schema .se.link{stroke-dasharray:5 4;stroke:var(--gen)}.schema .se.poly{stroke-dasharray:2 3}
.schema .se.self,.schema .se.self2{stroke:var(--accent)}.schema .se.sync{stroke:var(--gen);stroke-dasharray:5 4}
.schema .sarw{fill:var(--muted)}
.schema .sdiv{stroke:var(--line2);stroke-dasharray:3 4}
.schema .sz{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.schema .slegend text{font-size:11.5px;fill:var(--muted)}
.g2keys{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:860px){.g2keys{grid-template-columns:1fr 1fr}}@media (max-width:520px){.g2keys{grid-template-columns:1fr}}
/* ---- segmented switch: Teach | Curate in the header, and (owner 13 Nov, "Two tabs: Work | Papers") Work | Papers on Processes.
   Teach | Curate (owner 15 Nov: "Lets do 2 as well" and "curate should be hidden to peope except editors.") ----
   A small segmented switch before the tabs, shown only to the owner and editors. Its highlight slides like the tab pill
   (12 Nov ruling); hairline frame, theme2 tokens. Phones have no switch: the menu groups the tabs under Teach / Curate. */
.areasw{position:relative;display:inline-flex;align-items:center;gap:0;padding:2px;border:1px solid var(--line);border-radius:calc(var(--t2-r) + 2px);background:var(--bg)}
.areasw[hidden]{display:none}
.areasw button{position:relative;z-index:1;background:none;border:0;cursor:pointer;font:500 12px var(--sans);letter-spacing:.01em;color:var(--muted);padding:3px 10px;border-radius:var(--t2-r);line-height:18px;transition:color .18s}
.areasw button:hover{color:var(--ink)}
.areasw button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.areasw button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.areasw .aslider{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:var(--t2-r);background:var(--panel);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.06);transition:transform .28s cubic-bezier(.3,.7,.2,1),width .28s cubic-bezier(.3,.7,.2,1);z-index:0}
@media (prefers-reduced-motion:reduce){.areasw .aslider{transition:none}}
.views a[hidden]{display:none!important}
/* Difficulty and Reports are Review steps: under them the row has no paper picker or ← → */
.msheet .mgrp{display:grid;gap:2px}
.msheet .mgrp+.mgrp{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.msheet .mh{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 14px 2px}
@media (max-width:640px){header .areasw{display:none!important}}   /* the header's Teach | Curate only; Processes' Work | Papers stays on phones */
/* Curate-only controls elsewhere (e.g. "Open in Review" on bank cards) carry .edonly: hidden unless the viewer is the owner or an editor */
html:not(.editor) .edonly{display:none!important}
/* owner 13 Nov: "add a place somewhere for me to write down what to flesh out next" — the Next up card on Processes */
.procs #notesBox .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.procs .nupadd{display:flex;gap:8px;margin:0 0 10px;min-width:0}
.procs .nupadd input{flex:1 1 auto;min-width:0;font:400 14px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:var(--t2-r,6px);padding:6px 10px;min-height:32px;box-sizing:border-box}
.procs .nupadd input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.procs .nupadd .act{flex:none}
.procs .nlist{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.procs .nrow{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:0;border-top:1px solid var(--line);min-width:0;font-size:14px}
.procs .nrow:first-child{border-top:0}
.procs .nrow.ndrag{opacity:.45}
.procs .nrow.nover-b{box-shadow:inset 0 2px 0 var(--accent)}.procs .nrow.nover-a{box-shadow:inset 0 -2px 0 var(--accent)}
.procs .ngrip{flex:none;color:var(--muted);cursor:grab;font-size:12px;letter-spacing:-2px;user-select:none;padding:0 2px}
.procs .ntick{flex:none;width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}
.procs .ntext{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;line-height:1.4}
.procs .nrow.isdone .ntext{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.procs .nacts{flex:none;display:inline-flex;align-items:center;gap:2px}
.procs .nbtn{font:500 14px var(--sans);width:28px;height:28px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;padding:0}
.procs .nbtn:hover:not(:disabled){border-color:var(--line2);color:var(--ink)}.procs .nbtn:disabled{opacity:.3;cursor:default}
.procs .nbtn.ndel:hover{color:var(--bad);border-color:var(--bad)}
.procs .nbtn:focus-visible,.procs .ndelq button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.procs .ndelq{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.procs .ndelq button{font:600 12px var(--sans);border-radius:6px;padding:3px 8px;min-height:26px;cursor:pointer;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
.procs .ndelq .nyes{border-color:var(--bad);color:var(--bad)}
.procs .ndone{margin-top:10px}
.procs .ndone>summary{cursor:pointer;font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;padding:4px 0;list-style:none}
.procs .ndone>summary::-webkit-details-marker{display:none}
.procs .ndone>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.procs .ndone .nlist{margin-top:6px}
.procs .pstep{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.procs .pcard .jtimes,.procs .pqueue .jtimes,.procs .pdone .jtimes{margin-top:3px}
@media (hover:none){.procs .ngrip{display:none}}
@media (max-width:640px){.procs .nbtn{width:32px;height:32px}.procs .nrow{flex-wrap:wrap}.procs .nrow .ntext{flex-basis:calc(100% - 40px)}.procs .nacts{margin-left:auto}}
/* ==== Review: Inbox and one paper at a time (owner 13 Nov) ====
   "I think the next thing I want to do is refine the review process. It is just 7 tabs at the top and its not really clear the
   order / process." Choices: "One paper at a time" (a 5-step track), "An 'Inbox' beside papers" (three cards, empty ones collapse
   to a tick), "Merge into Review" (the papers list), names "Your calls · Flagged · Topics · Diagrams · Spot-check".
   Last in the cascade, after theme2: uses its tokens and radii. */

/* ---- the paper's bar: ← Inbox, the paper, its track, what to do here ---- */
.rbar{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding-block:10px 10px}
.rbar>*{min-width:0;max-width:100%}
.rtop{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;min-width:0}
.rback{font:500 13px var(--sans);color:var(--muted);text-decoration:none;white-space:nowrap;border-radius:var(--t2-r);padding:2px 0}
.rback:hover{color:var(--ink)}
.rback:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rtitle{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.rtitle b{font:600 15px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rtitle select{font-size:13px;max-width:14em}
.rleft{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rbar .rnav{margin-left:auto}
.rbar.paper #docF{display:none}
.rbar.list .track{display:none}
.rbar .stephelp{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.rbar .stephelp b{color:var(--ink);font-weight:600}

/* the track: numbered steps joined by hairlines; done = tick, open step = accent, nothing in the paper = dashed */
.track{list-style:none;margin:0;padding:0;display:flex;align-items:center;min-width:0}
.tstep{display:flex;align-items:center;min-width:0;flex:0 0 auto}
.tstep+.tstep{flex:1 1 auto}
.tstep+.tstep::before{content:"";flex:1 1 10px;min-width:8px;height:1px;background:var(--line2);margin:0 6px}
.tstep.done+.tstep::before,.tstep.none+.tstep::before{background:color-mix(in srgb,var(--ok) 45%,var(--line2))}
.track .step{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:4px 8px 4px 4px;min-height:36px;border-radius:var(--t2-r);font:500 13px var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap}
.track .step:hover{background:var(--t2-hover);color:var(--ink)}
.track .step:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.track .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;box-sizing:border-box;border:1.5px solid var(--line2);background:var(--panel);font:600 11.5px var(--sans);color:var(--muted);flex:0 0 auto}
.track .n{font:600 11.5px var(--sans);font-variant-numeric:tabular-nums;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 6px;line-height:18px}
.track .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tstep.todo .step{color:var(--ink)}
.tstep.done .num{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.tstep.none .num{border-style:dashed;opacity:.8}
.tstep.none .lab{opacity:.75}
.tstep.cur .step{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.tstep.cur .num{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.tstep.cur.done .num{background:var(--ok);border-color:var(--ok);color:var(--panel)}

/* the mini track (papers list, Inbox rows): 5 dots */
.mtrack{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.mtrack i{display:block;width:8px;height:8px;border-radius:50%;box-sizing:border-box;border:1.5px solid var(--line2);background:var(--panel)}
.mtrack i.done{background:var(--ok);border-color:var(--ok)}
.mtrack i.none{width:4px;height:4px;margin:2px;border:0;background:var(--line2)}   /* review 13 Nov: nothing in this paper for that step */
.mtrack i.cur{width:10px;height:10px;background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ipl{color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---- the Inbox ---- */
.inbox{padding-block:24px 64px;max-width:880px;margin-inline:auto}
.ihd h2{font-family:var(--display);font-weight:500;letter-spacing:-.022em;font-variation-settings:"opsz" 72;font-size:24px;line-height:1.2;margin:0 0 4px}
.ihd .sub{color:var(--muted);margin:0 0 6px;font-size:13.5px}
.icard{background:var(--panel);border:1px solid var(--line);border-radius:var(--t2-rl);margin-top:14px;min-width:0}
.ihead{display:flex;align-items:center;gap:14px;padding:14px 16px;color:inherit;text-decoration:none;border-radius:var(--t2-rl)}
.ihead:hover{background:var(--t2-hover)}
.ihead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ict{font:600 24px var(--sans);font-variant-numeric:tabular-nums;color:var(--warn);min-width:1.6ch;text-align:center;line-height:1}
.itx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 auto}
.itx b{font:600 15px var(--sans);color:var(--ink)}
.iwhat{color:var(--muted);font-size:13px;line-height:1.45}
.igo{color:var(--muted);font-size:13px;white-space:nowrap}
.ihead:hover .igo{color:var(--accent)}
.icard.idone{background:none}
.icard.idone .ihead{padding:10px 16px}
.icard.idone .itx{flex-direction:row;gap:10px;align-items:baseline;flex-wrap:wrap}
.icard.idone .itx b{font-size:14px}
.itick{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font:600 13px var(--sans);flex:0 0 auto}
.ipair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
.icard .banner.ready{margin:0 16px 10px}
.iplist{list-style:none;margin:0;padding:6px 8px;border-top:1px solid var(--line)}
.iprow{display:grid;grid-template-columns:minmax(0,1fr) auto 10.5em;gap:14px;align-items:center;padding:8px;border-radius:var(--t2-r);color:inherit;text-decoration:none}
.iprow:hover{background:var(--t2-hover)}
.iprow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ipn{font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
.ipn .rv-pnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* owner 17 Nov: "papers waiting on a Your call marked as such" */
.ipn .rv-call{flex:none;font-size:11.5px;font-weight:500;line-height:1.5;padding:0 7px;border-radius:999px;color:var(--warn);background:var(--warn-soft);white-space:nowrap}
/* owner 17 Nov: "group 'Papers to review' by batch, oldest first ('Batch 4 · 7 of 9 cleared')" (08_review.js inboxGroups) */
.rv-bgs{border-top:1px solid var(--line);padding:4px 0 2px}
.rv-bg .iplist{border-top:0;padding-top:0}
.rv-bgh{display:block;padding:8px 16px 4px;font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
summary.rv-bgh{cursor:pointer;border-radius:var(--t2-r);list-style:none}
summary.rv-bgh::-webkit-details-marker{display:none}
summary.rv-bgh::before{content:"▸";display:inline-block;width:1em;margin-right:4px;transition:transform .15s}
details.rv-bg[open]>summary.rv-bgh::before{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){summary.rv-bgh::before{transition:none}}
summary.rv-bgh:hover{color:var(--ink)}
summary.rv-bgh:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.rv-bgdone .rv-bgh{font-weight:500;padding-block:5px}
.rv-bgdone .rv-bgh::before{content:"✓";display:inline-block;width:1em;margin-right:4px;color:var(--ok)}
.iprow .ipl{text-align:right}
.imore{display:block;padding:8px 16px 12px;font-size:13px;border-top:1px solid var(--line)}
.ifoot{margin-top:18px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ifoot label{display:inline-flex;gap:6px;align-items:center}
.ifoot select{font-size:13px;max-width:16em}
.inbox a.imore,.ifoot a,.rv-pempty a.act.ghost{color:var(--accent)}
.inbox a.imore,.ifoot a{text-decoration:none}.inbox a.imore:hover,.ifoot a:hover{text-decoration:underline}
.inbox .handoff{margin-top:14px}

/* ---- a paper with nothing left ---- */
.rv-pempty{display:flex;flex-direction:column;gap:12px;text-align:left}
.rv-pempty>b{color:var(--ink);font-size:15px}
/* owner 13 Nov: "recently done looks so big": this panel was named .pdone, the same class as Processes' Recently done list, so its
   flex layout and 16px bold leaked there. Renamed .ppdone (paper done). */
.ppdone{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px}
.ppdone>div:first-of-type{flex:1 1 12em}
.ppdone b{color:var(--ink);font-size:16px}
.ppdone .row{flex-basis:100%}
.ptick{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font:600 18px var(--sans)}

/* ---- papers list, Reports and Difficulty: ← Inbox ---- */
.papers>.rback,.levels>.rback,.reports>.rback{display:inline-block;margin-bottom:8px}
.reports>.rback{margin-bottom:0}
table.pp td.ptrack{white-space:nowrap}
table.pp td.ptrack .ipl{margin-left:8px}
table.pp tr[data-flow]{cursor:pointer}
table.pp tbody tr[data-flow]:hover td{background:var(--t2-hover)}
a.plink{color:inherit;text-decoration:none}
a.plink:hover{text-decoration:underline}

/* Curate switch: the Inbox total */
.areasw .n{font:500 11px var(--sans);font-variant-numeric:tabular-nums;color:var(--warn);margin-left:5px}
.areasw .n:empty{display:none}

/* ---- phone ---- */
@media (max-width:640px){
  .rbar{gap:6px;padding-block:6px 8px}
  .rtop{flex-wrap:nowrap;gap:8px}
  .rtitle b{font-size:14px}
  .rleft{font-size:12px}
  .rbar .rnav .pos{display:none}
  .rbar .track .num{display:inline-grid}   /* 10_phone.css hid the old step numbers */
  .track .lab{display:none}
  .tstep.cur .lab{display:inline}
  .track .step{padding:4px;gap:5px;min-height:40px}
  .tstep+.tstep::before{margin:0 3px;min-width:4px}
  .track{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.track::-webkit-scrollbar{display:none}
  .track .n{padding:0 4px}
  .rbar .stephelp{display:block;font-size:12.5px}
  .rbar.list .rtop{flex-wrap:wrap}
  .rbar.list #docF{flex:1 1 100%}
  .ipair{grid-template-columns:minmax(0,1fr)}
  .inbox{padding-block:16px 48px}
  .ihead{gap:12px;padding:12px}
  .icard.idone .ihead{padding:10px 12px}
  .icard .banner.ready{margin:0 12px 10px}
  .iprow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px;padding:8px 6px}
  .iprow .ipl{grid-column:1/-1;text-align:left}
  .rv-bgh{padding-inline:12px}
  .ipn{flex-wrap:wrap;row-gap:3px}.ipn .rv-pnm{flex:1 1 100%}   /* phone: the your-call marker goes under the name, the name keeps the width */
  .imore{padding:8px 12px 12px}
}
/* a call on the whole paper, top of Your calls (owner 13 Nov) */
.why.pcall{margin:0 0 10px;text-align:left}.why.pcall p{margin:4px 0 8px;color:var(--ink)}.why.pcall .flagbox input{width:100%}
/* owner 17 Nov: original flag beside the fix, top of every returned item (08_review.js backBoxHTML) */

/* ---------- solutions ---------- */
const solDec=(q,s)=>reviews['q'+q.id]?.sol?.[s.id]??(q.tri?.ok_sols?.includes(s.id)?'approved':undefined);   // cleared by the checks (triage.py) unless you decide otherwise
function solHTML(q,s,mode){

  if(gen&&m.confidence!=null) badges.push(`<span class="badge ${m.confidence<0.6?'b-bad':''}">confidence ${Math.round(m.confidence*100)}%</span>`);
  if(gen&&m.check) badges.push(`<span class="badge ${/fail|mismatch|disagree|wrong|error/i.test(m.check)?'b-bad':'b-ok'}">self-check ${esc(m.check==='passed'?'passed':m.check)}</span>`);
  if(m.reused_from){const o=B.questions.find(x=>x.id===m.reused_from);badges.push(`<span class="badge">copied from ${o?esc(docLabel(B.docs[o.doc]))+' Q'+esc(o.number):'duplicate'}</span>`)}
  if(mode==='review'&&gen&&dec==='rejected') badges.push('<span class="badge b-bad">rejected</span>');
  const crit=(s.criteria||[]).filter(c=>c[1]);
  const single=crit.length===1&&/^(provides )?(the )?correct answer\.?$|^\(?[A-D]\)?$/i.test(crit[0][1].trim());
  const ansCell=`<td class="m ans">${(show=>show?key:'')(mode==='review'||mode==='tags'||revealed.has(q.id))}</td>`;
  const mcqRows=[[crit.reduce((t,c)=>t+(+c[0]||0),0)||q.marks||1,'']];   // owner: MCQ criterion is always just "Correct answer"
  const rub=isMcq?`<table class="rub"><thead><tr><th scope="col">Marks</th><th scope="col">Answer</th><th scope="col">Criterion</th></tr></thead><tbody>${mcqRows.map((c,i)=>`<tr><td class="m">${c[0]??'–'}</td>${i===0?ansCell:'<td class="m"></td>'}<td>${c[1]?tex(c[1]):'Correct answer'}</td></tr>`).join('')}</tbody></table>`
   :crit.length?`<table class="rub"><thead><tr><th scope="col">Marks</th><th scope="col">Criterion</th></tr></thead><tbody>${crit.map(c=>`<tr><td class="m">${c[0]??'–'}</td><td>${tex(c[1])}</td></tr>`).join('')}</tbody></table>`:'';
  const actions=mode==='review'&&gen?`<div class="row"><button class="act ok" data-sol="${s.id}" data-v="approved">Approve solution</button><button class="act warn" data-sol="${s.id}" data-v="rejected">Reject</button></div>`:'';
  return `<div class="sol ${s.source}"><div class="shd">${badges.join('')}</div>${(s.latex||'').trim()?`<div class="tx">${tex(s.latex)}</div>`:''}${rub}
    ${m.marker_note?`<div class="callout"><b>Marker's note:</b> ${tex(m.marker_note)}</div>`:''}
    ${m.concern?`<div class="callout"><b>Check this:</b> ${tex(m.concern)}</div>`:''}${m.corrected?(mode==='review'?`<div class="callout"><b>Corrected from source (check):</b> ${tex(m.corrected.replace(/^Corrected from source: /,''))}</div>`:`<div class="help">${tex(m.corrected)}</div>`):''}${mode==='review'&&m.rubric_note?`<div class="help">${esc(m.rubric_note)}</div>`:''}${mode==='review'&&m.source_flag?`<div class="callout"><b>Possible error in the source:</b> ${tex(m.source_flag)}</div>`:''}${actions}</div>`;

function solsFor(q,pid,mode){

let _clean=null;
function spotClean(doc){_clean=_clean||{};if(doc in _clean)return _clean[doc];let ok=true,any=false;
  B.questions.forEach(q=>{if(q.doc!==doc||q.dup_of)return;chkFigsAll(q).forEach(k=>{if(figRisk(k)[0]==='High'&&spotSet().has(k)){any=true;if(reviews['q'+q.id]?.fig?.[k]!=='approved')ok=false}})});
  return _clean[doc]=any&&ok&&!escalated(doc)}
const figDec=(q,k)=>reviews['q'+q.id]?.fig?.[k]??(q.tri?.ok_figs?.includes(k)?'approved':(figRisk(k)[0]==='High'&&!spotSet().has(k)&&spotClean(q.doc)?'approved':undefined));

function figKeys(q){const f=q.fk||{};return {inline:new Set(f.i||[]),all:f.a||[],opt:new Set(f.o||[])}}

const PACKS={}, SVGS={};
